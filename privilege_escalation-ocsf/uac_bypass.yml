---
title: uac_bypass_attempt
description: Detects known UAC bypass techniques including auto-elevating COM objects and fodhelper abuse.
author: nano.rs
severity: high
mode: live
detection_mode: scheduled
schedule: "*/2 * * * *"
lookback: 5m
folder: endpoint
mitre_tactics:
  - TA0004
mitre_techniques:
  - T1548.002
tags:
  - uac
  - bypass
  - windows
ai_triage_hints:
  ignore_when:
    - "Elevation is from a signed installer"
    - "IT admin performing authorized elevation"
  suspicious_when:
    - "Auto-elevating COM object spawns shell"
    - "fodhelper or computerdefaults used for bypass"
---
metadata.log_source="windows_sysmon" OR metadata.log_source="endpoint_edr"
| where class_uid=1007 AND activity_id=1
| where (process.name="fodhelper.exe" OR process.name="computerdefaults.exe" OR process.name="sdclt.exe" OR process.name="eventvwr.exe")
| where actor.process.name NOT IN ("explorer.exe", "svchost.exe")
| eval esc_shell_initiated_uac_bypass=(lower(actor.process.name)="cmd.exe" OR lower(actor.process.name)="powershell.exe" OR lower(actor.process.name)="pwsh.exe")
| risk score=min(100, 80 + if(esc_shell_initiated_uac_bypass, 10, 0)) entity=device.hostname factor=concat("Potential UAC bypass", if(esc_shell_initiated_uac_bypass, "; Shell-initiated UAC bypass", ""))
| table time, device.hostname, actor.user.name, process.name, actor.process.name, process.cmd_line, risk_score, risk_factors

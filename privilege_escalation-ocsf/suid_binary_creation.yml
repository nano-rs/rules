---
title: suid_sgid_binary_creation
description: Detects creation of new SUID/SGID binaries on Linux systems.
author: nano.rs
severity: high
mode: live
detection_mode: scheduled
schedule: "*/5 * * * *"
lookback: 15m
folder: endpoint
mitre_tactics:
  - TA0004
mitre_techniques:
  - T1548.001
tags:
  - suid
  - linux
  - privilege_escalation
ai_triage_hints:
  ignore_when:
    - "SUID set by package manager during install"
    - "Known deployment tool setting permissions"
  suspicious_when:
    - "SUID set on shell or interpreter"
    - "Binary is in non-standard location"
---
metadata.log_source="linux_audit" OR metadata.log_source="endpoint_edr"
| where class_uid=1007 AND activity_id=1
| where process.name="chmod" AND (process.cmd_line CONTAINS "+s" OR process.cmd_line CONTAINS "4755" OR process.cmd_line CONTAINS "2755" OR process.cmd_line CONTAINS "u+s")
| eval esc_suid_in_temp_directory=(lower(process.cmd_line) CONTAINS "/tmp" OR lower(process.cmd_line) CONTAINS "/dev/shm" OR lower(process.cmd_line) CONTAINS "/var/tmp")
| risk score=min(100, 70 + if(esc_suid_in_temp_directory, 20, 0)) entity=device.hostname factor=concat("SUID/SGID binary created", if(esc_suid_in_temp_directory, "; SUID in temp directory", ""))
| table time, device.hostname, actor.user.name, process.cmd_line, risk_score, risk_factors

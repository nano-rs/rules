---
title: suspicious_cron_job_creation
description: Detects creation of cron jobs with suspicious commands or by unusual processes.
author: nano.rs
severity: medium
mode: live
detection_mode: scheduled
schedule: "*/5 * * * *"
lookback: 15m
folder: endpoint
mitre_tactics:
  - TA0003
  - TA0002
mitre_techniques:
  - T1053.003
tags:
  - cron
  - linux
  - persistence
ai_triage_hints:
  ignore_when:
    - "Cron job is from package manager or system update"
    - "Known automation tool creating scheduled task"
  suspicious_when:
    - "Cron command includes network activity (curl, wget)"
    - "Cron command runs encoded or obfuscated script"
---
source_type=linux_audit OR source_type=endpoint_edr
| where event_type="process_create"
| where process_name="crontab" OR file_path CONTAINS "/cron.d/" OR file_path CONTAINS "/crontab"
| eval esc_network_command_in_cron=(lower(command_line) CONTAINS "curl" OR lower(command_line) CONTAINS "wget" OR lower(command_line) CONTAINS "nc " OR lower(command_line) CONTAINS "python")
| eval esc_encoded_or_piped_execution=(lower(command_line) CONTAINS "base64" OR lower(command_line) CONTAINS "|sh" OR lower(command_line) CONTAINS "|bash")
| risk score=min(100, 45 + if(esc_network_command_in_cron, 30, 0) + if(esc_encoded_or_piped_execution, 40, 0)) entity=src_host factor=concat("Cron job modified", if(esc_network_command_in_cron, "; Network command in cron", ""), if(esc_encoded_or_piped_execution, "; Encoded or piped execution", ""))
| table timestamp, src_host, user, command_line, risk_score, risk_factors

---
title: new_suspicious_windows_service
description: Detects creation of new Windows services with suspicious characteristics.
author: nano.rs
severity: medium
mode: live
detection_mode: scheduled
schedule: "*/5 * * * *"
lookback: 15m
folder: endpoint
mitre_tactics:
  - TA0003
mitre_techniques:
  - T1543.003
tags:
  - service
  - persistence
  - windows
ai_triage_hints:
  ignore_when:
    - "Service is from known software installation"
    - "Service binary is in Program Files with valid signature"
  suspicious_when:
    - "Service binary in temp or user-writable path"
    - "Service created by cmd.exe or powershell"
---
source_type=windows_sysmon OR source_type=windows_security
| where event_type="service_create" OR (process_name="sc.exe" AND command_line CONTAINS "create")
| eval esc_suspicious_binary_path=(lower(command_line) CONTAINS "temp" OR lower(command_line) CONTAINS "appdata" OR lower(command_line) CONTAINS "programdata")
| eval esc_shell_in_service_command=(lower(command_line) CONTAINS "powershell" OR lower(command_line) CONTAINS "cmd /c")
| risk score=min(100, 50 + if(esc_suspicious_binary_path, 25, 0) + if(esc_shell_in_service_command, 35, 0)) entity=src_host factor=concat("New service created", if(esc_suspicious_binary_path, "; Suspicious binary path", ""), if(esc_shell_in_service_command, "; Shell in service command", ""))
| table timestamp, src_host, user, process_name, command_line, risk_score, risk_factors

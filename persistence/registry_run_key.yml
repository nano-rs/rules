---
title: registry_run_key_modification
description: Detects modification of registry Run/RunOnce keys for persistence.
author: nano.rs
severity: medium
mode: live
detection_mode: scheduled
schedule: "*/3 * * * *"
lookback: 10m
folder: endpoint
mitre_tactics:
  - TA0003
mitre_techniques:
  - T1547.001
tags:
  - registry
  - persistence
  - windows
ai_triage_hints:
  ignore_when:
    - "Software installer adding legitimate startup entry"
    - "GPO-deployed startup configuration"
  suspicious_when:
    - "Value points to executable in temp or user directory"
    - "Registry change made by scripting engine"
---
source_type=windows_sysmon OR source_type=endpoint_edr
| where event_type="registry_set"
| where registry_key_name CONTAINS "\\CurrentVersion\\Run"
| where registry_value_data CONTAINS "Temp" OR registry_value_data CONTAINS "AppData" OR registry_value_data CONTAINS "powershell" OR registry_value_data CONTAINS "cmd.exe"
| eval esc_script_engine_modified_run_key=(lower(process_name)="powershell.exe" OR lower(process_name)="cmd.exe" OR lower(process_name)="wscript.exe" OR lower(process_name)="cscript.exe" OR lower(process_name)="mshta.exe")
| risk score=min(100, 60 + if(esc_script_engine_modified_run_key, 20, 0)) entity=src_host factor=concat("Suspicious Run key", if(esc_script_engine_modified_run_key, "; Script engine modified Run key", ""))
| table timestamp, src_host, user, process_name, registry_key_name, registry_value_data, risk_score, risk_factors

---
title: suspicious_scheduled_task_creation
description: Detects creation of scheduled tasks with suspicious characteristics such as execution from temp directories, encoded PowerShell, or tasks created by unusual parent processes.
author: nano.rs
severity: medium
mode: staging
detection_mode: scheduled
schedule: "*/5 * * * *"
lookback: 15m
folder: endpoint
mitre_tactics:
  - TA0003
  - TA0002
mitre_techniques:
  - T1053.005
tags:
  - persistence
  - scheduled_task
  - windows
ai_triage_hints:
  ignore_when:
    - "Task is created by SCCM, GPO, or enterprise management"
    - "Task name matches known software update patterns"
    - "Created by signed Microsoft or vendor binary"
  suspicious_when:
    - "Task runs executable from temp or user-writable directory"
    - "Task name is random or obfuscated"
    - "Parent process is scripting engine or Office app"
    - "Task triggers on system events rather than schedule"
---
source_type=windows_sysmon OR source_type=windows_security
| where event_type="scheduled_task_create" OR (process_name="schtasks.exe" AND command_line CONTAINS "/create")
| eval esc_suspicious_execution_path=(lower(command_line) CONTAINS "temp" OR lower(command_line) CONTAINS "appdata")
| eval esc_encoded_command_in_task=(lower(command_line) CONTAINS "-enc")
| eval esc_script_engine_parent=(lower(parent_process_name)="wscript.exe" OR lower(parent_process_name)="cscript.exe" OR lower(parent_process_name)="mshta.exe")
| eval esc_office_app_parent=(lower(parent_process_name)="winword.exe" OR lower(parent_process_name)="excel.exe" OR lower(parent_process_name)="powerpnt.exe")
| risk score=min(100, 45 + if(esc_suspicious_execution_path, 25, 0) + if(esc_encoded_command_in_task, 40, 0) + if(esc_script_engine_parent, 35, 0) + if(esc_office_app_parent, 45, 0)) entity=src_host factor=concat("Scheduled task created", if(esc_suspicious_execution_path, "; Suspicious execution path", ""), if(esc_encoded_command_in_task, "; Encoded command in task", ""), if(esc_script_engine_parent, "; Script engine parent", ""), if(esc_office_app_parent, "; Office app parent", ""))
| table timestamp, src_host, user, process_name, parent_process_name, command_line, risk_score, risk_factors

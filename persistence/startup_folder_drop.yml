---
title: file_dropped_in_startup_folder
description: Detects files created in Windows Startup folders for persistence.
author: nano.rs
severity: medium
mode: live
detection_mode: scheduled
schedule: "*/3 * * * *"
lookback: 10m
folder: endpoint
mitre_tactics:
  - TA0003
mitre_techniques:
  - T1547.001
tags:
  - startup
  - persistence
  - windows
ai_triage_hints:
  ignore_when:
    - "File is a known application shortcut"
    - "Created during software installation"
  suspicious_when:
    - "File is a script (.vbs, .js, .bat, .ps1)"
    - "File was recently downloaded or created by browser"
---
source_type=windows_sysmon OR source_type=endpoint_edr
| where file_action="create"
| where file_path CONTAINS "\\Start Menu\\Programs\\Startup\\"
| eval esc_executable_in_startup=match(file_path, "(?i)(\.exe|\.bat|\.cmd|\.vbs|\.js|\.ps1|\.hta)$")
| prevalence enrich=true window=30d
| eval esc_rare_file_in_startup=(host_count < 5)
| risk score=min(100, 60 + if(esc_executable_in_startup, 20, 0) + if(esc_rare_file_in_startup, 30, 0)) entity=src_host factor=concat("Startup folder persistence", if(esc_executable_in_startup, "; Executable in startup", ""), if(esc_rare_file_in_startup, "; Rare file in startup", ""))
| table timestamp, src_host, user, file_path, file_hash, process_name, host_count, risk_score, risk_factors, esc_executable_in_startup

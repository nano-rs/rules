---
title: access_token_manipulation
description: Detects processes attempting to manipulate access tokens for privilege escalation.
author: nano.rs
severity: high
mode: live
detection_mode: scheduled
schedule: "*/3 * * * *"
lookback: 10m
folder: endpoint
mitre_tactics:
  - TA0004
mitre_techniques:
  - T1134
tags:
  - token
  - privilege_escalation
  - windows
ai_triage_hints:
  ignore_when:
    - "Process is a known security tool or EDR"
    - "Token impersonation by IIS or SQL Server"
  suspicious_when:
    - "Non-admin process manipulating tokens"
    - "Token from SYSTEM or Domain Admin"
---
source_type=windows_sysmon OR source_type=endpoint_edr
| where event_type="process_create" OR event_type="process_access"
| where command_line CONTAINS "token" AND (command_line CONTAINS "duplicate" OR command_line CONTAINS "impersonate" OR command_line CONTAINS "assign")
| eval esc_unusual_token_manipulator=(lower(process_name)!="lsass.exe" AND lower(process_name)!="csrss.exe" AND lower(process_name)!="services.exe" AND lower(process_name)!="svchost.exe")
| risk score=min(100, 70 + if(esc_unusual_token_manipulator, 15, 0)) entity=src_host factor=concat("Token manipulation", if(esc_unusual_token_manipulator, "; Unusual token manipulator", ""))
| table timestamp, src_host, user, process_name, command_line, risk_score, risk_factors

---
title: sudo_privilege_escalation_abuse
description: Detects suspicious sudo usage patterns including sudo to non-standard users or sudo with suspicious commands.
author: nano.rs
severity: medium
mode: live
detection_mode: scheduled
schedule: "*/5 * * * *"
lookback: 15m
folder: endpoint
mitre_tactics:
  - TA0004
mitre_techniques:
  - T1548.003
tags:
  - sudo
  - linux
  - privilege_escalation
ai_triage_hints:
  ignore_when:
    - "Admin performing routine maintenance"
    - "Known automation using sudo"
  suspicious_when:
    - "sudo to non-root user account"
    - "sudo running shell or network commands"
---
source_type=linux_audit OR source_type=endpoint_edr
| where event_type="process_create"
| where process_name="sudo"
| where command_line CONTAINS "bash" OR command_line CONTAINS "sh -c" OR command_line CONTAINS "python" OR command_line CONTAINS "perl"
| eval esc_sudo_to_non_root_user=(lower(command_line) CONTAINS "-u" AND (lower(command_line) CONTAINS "-u root") = false)
| eval esc_suid_bit_modification_via_sudo=(lower(command_line) CONTAINS "chmod" AND lower(command_line) CONTAINS "+s")
| risk score=min(100, 45 + if(esc_sudo_to_non_root_user, 25, 0) + if(esc_suid_bit_modification_via_sudo, 45, 0)) entity=src_host factor=concat("Sudo shell execution", if(esc_sudo_to_non_root_user, "; Sudo to non-root user", ""), if(esc_suid_bit_modification_via_sudo, "; SUID bit modification via sudo", ""))
| table timestamp, src_host, user, command_line, risk_score, risk_factors

---
title: unsigned_kernel_driver_load
description: Detects loading of unsigned or rarely seen kernel drivers which may indicate privilege escalation or rootkit installation.
author: nano.rs
severity: critical
mode: live
detection_mode: scheduled
schedule: "*/2 * * * *"
lookback: 5m
folder: endpoint
mitre_tactics:
  - TA0004
mitre_techniques:
  - T1068
tags:
  - driver
  - kernel
  - rootkit
  - windows
ai_triage_hints:
  ignore_when:
    - "Driver is from known hardware vendor update"
    - "Driver is signed by Microsoft or WHQL"
  suspicious_when:
    - "Driver has no digital signature"
    - "Driver loaded from temp or user directory"
---
source_type=windows_sysmon OR source_type=endpoint_edr
| where event_type="driver_load"
| prevalence enrich=true window=30d
| where host_count < 10
| eval esc_very_rare_driver=(host_count < 3)
| eval esc_driver_from_suspicious_path=(lower(file_path) CONTAINS "temp" OR lower(file_path) CONTAINS "appdata" OR lower(file_path) CONTAINS "downloads")
| risk score=min(100, 70 + if(esc_very_rare_driver, 20, 0) + if(esc_driver_from_suspicious_path, 25, 0)) entity=src_host factor=concat("Rare kernel driver", if(esc_very_rare_driver, "; Very rare driver", ""), if(esc_driver_from_suspicious_path, "; Driver from suspicious path", ""))
| table timestamp, src_host, file_path, file_hash, host_count, risk_score, risk_factors

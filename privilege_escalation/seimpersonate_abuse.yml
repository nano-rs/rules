---
title: seimpersonate_privilege_abuse
description: Detects abuse of SeImpersonatePrivilege commonly exploited by Potato-family exploits on Windows.
author: nano.rs
severity: high
mode: live
detection_mode: scheduled
schedule: "*/3 * * * *"
lookback: 10m
folder: endpoint
mitre_tactics:
  - TA0004
mitre_techniques:
  - T1134.001
tags:
  - potato
  - impersonation
  - windows
ai_triage_hints:
  ignore_when:
    - "IIS or SQL Server performing normal impersonation"
    - "Known service account behavior"
  suspicious_when:
    - "Service account spawning interactive shell"
    - "SYSTEM shell from web or database service"
---
source_type=windows_sysmon OR source_type=endpoint_edr
| where event_type="process_create"
| where parent_process_name IN ("w3wp.exe", "sqlservr.exe", "mssql.exe", "tomcat.exe")
| where process_name IN ("cmd.exe", "powershell.exe", "whoami.exe", "net.exe")
| eval esc_system_shell_from_service=(lower(user) CONTAINS "system" OR lower(user) CONTAINS "nt authority")
| risk score=min(100, 80 + if(esc_system_shell_from_service, 15, 0)) entity=src_host factor=concat("Service account spawning shell", if(esc_system_shell_from_service, "; SYSTEM shell from service", ""))
| table timestamp, src_host, user, parent_process_name, process_name, command_line, risk_score, risk_factors

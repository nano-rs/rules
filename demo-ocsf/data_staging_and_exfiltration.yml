---
title: data_staging_and_exfiltration
description: Detects data staging patterns — robocopy to temp directories, archive creation with Compress-Archive, or base64 encoding of files with certutil. These indicate an attacker collecting and preparing data for exfiltration.
author: nano.rs
severity: high
mode: staging
detection_mode: scheduled
schedule: "*/5 * * * *"
lookback: 15m
folder: endpoint
mitre_tactics:
  - TA0009
mitre_techniques:
  - T1560.001
  - T1074.001
tags:
  - exfiltration
  - staging
  - collection
  - endpoint
  - injector-demo
ai_triage_hints:
  ignore_when:
    - "Robocopy is part of a scheduled backup job"
    - "User is IT staff performing documented file migration"
  suspicious_when:
    - "Target directory is in C:\\temp or a user-writable location"
    - "Compress-Archive targets sensitive file types (docx, xlsx, pdf)"
    - "Followed by certutil encoding or network upload"
---
metadata.log_source="windows_sysmon" class_uid=1007 activity_id=1 (process.name="robocopy.exe" OR (process.name="powershell.exe" process.cmd_line CONTAINS "Compress-Archive") OR (process.name="certutil.exe" process.cmd_line CONTAINS "-encode"))
| stats count() as hits, dc(process.name) as unique_tools, values(process.name) as tools, values(process.cmd_line) as commands by device.hostname, actor.user.name
| where hits > 0

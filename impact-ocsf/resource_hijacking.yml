---
title: cryptomining_resource_hijacking
description: Detects cryptocurrency mining activity hijacking system resources.
author: nano.rs
severity: medium
mode: live
detection_mode: scheduled
schedule: "*/10 * * * *"
lookback: 30m
folder: endpoint
mitre_tactics:
  - TA0040
mitre_techniques:
  - T1496
tags:
  - cryptomining
  - resource_hijack
  - cross_platform
ai_triage_hints:
  ignore_when:
    - "Authorized mining operation"
  suspicious_when:
    - "Mining on production server"
    - "High CPU with mining pool connections"
---
class_uid=1007
| where process.cmd_line CONTAINS "stratum" OR process.cmd_line CONTAINS "xmrig" OR process.cmd_line CONTAINS "minerd" OR process.cmd_line CONTAINS "cpuminer" OR process.cmd_line CONTAINS "cryptonight" OR process.cmd_line CONTAINS "pool.minergate"
| eval esc_mining_on_server=(lower(device.hostname) CONTAINS "srv" OR lower(device.hostname) CONTAINS "server" OR lower(device.hostname) CONTAINS "prod")
| risk score=min(100, 70 + if(esc_mining_on_server, 15, 0)) entity=device.hostname factor=concat("Cryptomining detected", if(esc_mining_on_server, "; Mining on server", ""))
| table time, device.hostname, actor.user.name, process.name, process.cmd_line, risk_score, risk_factors

---
title: disk_wipe_utility_execution
description: Detects execution of disk wiping tools that destroy data on disk.
author: nano.rs
severity: critical
mode: live
detection_mode: scheduled
schedule: "*/1 * * * *"
lookback: 5m
folder: endpoint
mitre_tactics:
  - TA0040
mitre_techniques:
  - T1561
tags:
  - wiper
  - destruction
  - critical
ai_triage_hints:
  ignore_when:
    - "IT decommissioning hardware"
    - "Authorized data sanitization"
  suspicious_when:
    - "Wiper tool on production system"
    - "Disk wipe without change management"
---
class_uid=1007
| where process.name IN ("sdelete.exe", "cipher.exe", "shred", "dd") OR process.cmd_line CONTAINS "format /q" OR process.cmd_line CONTAINS "diskpart" AND process.cmd_line CONTAINS "clean"
| eval esc_physical_disk_wipe=(lower(process.cmd_line) CONTAINS "/dev/sda" OR lower(process.cmd_line) CONTAINS "physicaldrive" OR lower(process.cmd_line) CONTAINS "clean all")
| risk score=min(100, 80 + if(esc_physical_disk_wipe, 15, 0)) entity=device.hostname factor=concat("Disk wipe tool detected", if(esc_physical_disk_wipe, "; Physical disk wipe", ""))
| table time, device.hostname, actor.user.name, process.name, process.cmd_line, risk_score, risk_factors

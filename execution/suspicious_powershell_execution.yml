---
title: suspicious_powershell_encoded_execution
description: Detects PowerShell execution with suspicious command-line patterns including encoded commands, download cradles, AMSI bypass attempts, and execution policy bypasses.
author: nano.rs
severity: high
mode: staging
detection_mode: scheduled
schedule: "*/2 * * * *"
lookback: 5m
folder: endpoint
mitre_tactics:
  - TA0002
  - TA0005
  - TA0112
mitre_techniques:
  - T1059.001
  - T1027
  - T1685
tags:
  - powershell
  - obfuscation
  - windows
ai_triage_hints:
  ignore_when:
    - "Command is from SCCM, Intune, or other management tools"
    - "Script is a known IT automation (check hash against approved scripts)"
    - "User is a developer running build scripts"
  suspicious_when:
    - "Multiple obfuscation techniques in single command"
    - "Parent process is Office application or browser"
    - "Command downloads and executes in memory (fileless)"
    - "AMSI bypass detected alongside other suspicious patterns"
---
source_type=windows_sysmon OR source_type=windows_security OR source_type=endpoint_edr
| where event_type="process_create"
| where process_name="powershell.exe" OR process_name="pwsh.exe"
| where command_line=/-e(nc(odedcommand)?)?\s/i OR command_line CONTAINS "IEX" OR command_line CONTAINS "Invoke-Expression" OR command_line CONTAINS "downloadstring"
| eval esc_encoded_command=(lower(command_line) CONTAINS "-enc")
| eval esc_download_cradle=(lower(command_line) CONTAINS "iex" OR lower(command_line) CONTAINS "invoke-expression")
| eval esc_amsi_bypass_attempt=(lower(command_line) CONTAINS "amsi")
| eval esc_office_parent_process=(lower(parent_process_name)="winword.exe" OR lower(parent_process_name)="excel.exe" OR lower(parent_process_name)="outlook.exe")
| risk score=min(100, 50 + if(esc_encoded_command, 20, 0) + if(esc_download_cradle, 35, 0) + if(esc_amsi_bypass_attempt, 45, 0) + if(esc_office_parent_process, 45, 0)) entity=src_host factor=concat("Suspicious PowerShell", if(esc_encoded_command, "; Encoded command", ""), if(esc_download_cradle, "; Download cradle", ""), if(esc_amsi_bypass_attempt, "; AMSI bypass attempt", ""), if(esc_office_parent_process, "; Office parent process", ""))
| table timestamp, src_host, user, process_name, parent_process_name, command_line, risk_score, risk_factors

---
title: regsvr32_scrobj_execution
description: Detects regsvr32 loading scrobj.dll or executing remote scriptlets (Squiblydoo attack).
author: nano.rs
severity: high
mode: live
detection_mode: scheduled
schedule: "*/2 * * * *"
lookback: 5m
folder: endpoint
mitre_tactics:
  - TA0005
mitre_techniques:
  - T1218.010
tags:
  - regsvr32
  - squiblydoo
  - lolbin
  - windows
ai_triage_hints:
  ignore_when:
    - "regsvr32 is registering a known legitimate DLL"
    - "Execution is part of software installation"
  suspicious_when:
    - "Loading scrobj.dll with /i parameter"
    - "Remote URL in command line"
---
source_type=windows_sysmon OR source_type=endpoint_edr
| where event_type="process_create"
| where process_name="regsvr32.exe"
| where command_line CONTAINS "scrobj" OR command_line CONTAINS "/i:http" OR command_line CONTAINS "/i:https"
| eval esc_remote_scriptlet=(lower(command_line) CONTAINS "http")
| risk score=min(100, 80 + if(esc_remote_scriptlet, 10, 0)) entity=src_host factor=concat("Regsvr32 scriptlet execution", if(esc_remote_scriptlet, "; Remote scriptlet", ""))
| table timestamp, src_host, user, parent_process_name, command_line, risk_score, risk_factors

---
title: shell_spawned_by_windows_services
description: Detects command shells or PowerShell spawned by services.exe, indicating potential service exploitation or persistence.
author: nano.rs
severity: high
mode: live
detection_mode: scheduled
schedule: "*/2 * * * *"
lookback: 5m
folder: endpoint
mitre_tactics:
  - TA0003
mitre_techniques:
  - T1543.003
tags:
  - services
  - persistence
  - windows
ai_triage_hints:
  ignore_when:
    - "Service is a known management agent (SCCM, Intune)"
    - "Service is running a scheduled maintenance script"
  suspicious_when:
    - "Shell command includes network activity or file downloads"
    - "Service was recently created or modified"
---
source_type=windows_sysmon OR source_type=endpoint_edr
| where event_type="process_create"
| where parent_process_name="services.exe"
| where process_name IN ("cmd.exe", "powershell.exe", "pwsh.exe")
| eval esc_suspicious_shell_command=(lower(command_line) CONTAINS "-enc" OR lower(command_line) CONTAINS "downloadstring" OR lower(command_line) CONTAINS "iex")
| risk score=min(100, 70 + if(esc_suspicious_shell_command, 20, 0)) entity=src_host factor=concat("Shell via services", if(esc_suspicious_shell_command, "; Suspicious shell command", ""))
| table timestamp, src_host, user, process_name, command_line, risk_score, risk_factors

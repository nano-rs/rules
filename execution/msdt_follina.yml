---
title: msdt_diagnostic_tool_abuse
description: Detects Microsoft Support Diagnostic Tool (msdt.exe) execution with suspicious parameters, associated with Follina and similar exploits.
author: nano.rs
severity: critical
mode: live
detection_mode: scheduled
schedule: "*/1 * * * *"
lookback: 5m
folder: endpoint
mitre_tactics:
  - TA0002
mitre_techniques:
  - T1203
tags:
  - msdt
  - follina
  - exploit
  - windows
ai_triage_hints:
  ignore_when:
    - "User manually launched diagnostics from control panel"
    - "IT support initiated the diagnostic session"
  suspicious_when:
    - "msdt launched by Office application"
    - "Command contains PCWDiagnostic or IT_BrowseForFile"
---
source_type=windows_sysmon OR source_type=endpoint_edr
| where event_type="process_create"
| where process_name="msdt.exe"
| where command_line CONTAINS "PCWDiagnostic" OR command_line CONTAINS "IT_BrowseForFile" OR command_line CONTAINS "ms-msdt:"
| eval esc_office_parent_likely_exploitation=(lower(parent_process_name)="winword.exe" OR lower(parent_process_name)="excel.exe" OR lower(parent_process_name)="outlook.exe")
| risk score=min(100, 90 + if(esc_office_parent_likely_exploitation, 5, 0)) entity=src_host factor=concat("MSDT abuse (Follina-like)", if(esc_office_parent_likely_exploitation, "; Office parent - likely exploitation", ""))
| table timestamp, src_host, user, parent_process_name, command_line, risk_score, risk_factors

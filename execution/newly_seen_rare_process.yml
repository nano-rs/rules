---
title: newly_seen_rare_process_execution
description: Detects execution of processes with file hashes that are both rare (seen on few hosts) AND newly appeared in the environment (first seen recently). This combination is highly indicative of new malware or attacker tools being deployed.
author: nano.rs
severity: high
mode: staging
detection_mode: scheduled
schedule: "*/5 * * * *"
lookback: 1h
folder: endpoint
mitre_tactics:
  - TA0002
mitre_techniques:
  - T1204.002
tags:
  - prevalence
  - rare_hash
  - new_artifact
  - execution
ai_triage_hints:
  ignore_when:
    - "Hash belongs to a recently deployed software update"
    - "Process is from a new but legitimate application install"
    - "File is signed by a trusted vendor"
  suspicious_when:
    - "Hash has no vendor signature"
    - "Process spawns child processes or makes network connections"
    - "File located in temp or user-writable directory"
    - "Execution shortly after file creation"
---
source_type=windows_sysmon OR source_type=endpoint_edr
| where event_type="process_create"
| where process_hash != ""
| prevalence enrich=true window=30d
| where host_count < 5 AND prevalence_first_seen > now() - INTERVAL 24 HOUR
| eval esc_very_rare_hash=(host_count < 3)
| eval esc_suspicious_execution_path=(lower(process_path) CONTAINS "temp" OR lower(process_path) CONTAINS "appdata\\local")
| risk score=min(100, 80 + if(esc_very_rare_hash, 10, 0) + if(esc_suspicious_execution_path, 15, 0)) entity=src_host factor=concat("Newly seen rare process", if(esc_very_rare_hash, "; Very rare hash", ""), if(esc_suspicious_execution_path, "; Suspicious execution path", ""))
| table timestamp, src_host, user, process_name, process_path, process_hash, host_count, prevalence_first_seen, is_rare, parent_process_name, command_line, risk_score, risk_factors

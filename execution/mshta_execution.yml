---
title: mshta_suspicious_execution
description: Detects mshta.exe executing HTA files from suspicious locations or with inline scripts.
author: nano.rs
severity: high
mode: live
detection_mode: scheduled
schedule: "*/2 * * * *"
lookback: 5m
folder: endpoint
mitre_tactics:
  - TA0005
mitre_techniques:
  - T1218.005
tags:
  - mshta
  - lolbin
  - windows
ai_triage_hints:
  ignore_when:
    - "HTA file is part of known enterprise application"
    - "Execution is from trusted internal path"
  suspicious_when:
    - "HTA loaded from URL or temp directory"
    - "Inline VBScript or JavaScript in command line"
---
source_type=windows_sysmon OR source_type=endpoint_edr
| where event_type="process_create"
| where process_name="mshta.exe"
| where command_line CONTAINS "http" OR command_line CONTAINS "javascript:" OR command_line CONTAINS "vbscript:" OR command_line CONTAINS "Temp"
| eval esc_remote_hta_execution=(lower(command_line) CONTAINS "http://" OR lower(command_line) CONTAINS "https://")
| eval esc_office_parent_process=(lower(parent_process_name)="winword.exe" OR lower(parent_process_name)="excel.exe" OR lower(parent_process_name)="outlook.exe")
| risk score=min(100, 70 + if(esc_remote_hta_execution, 15, 0) + if(esc_office_parent_process, 25, 0)) entity=src_host factor=concat("Suspicious mshta execution", if(esc_remote_hta_execution, "; Remote HTA execution", ""), if(esc_office_parent_process, "; Office parent process", ""))
| table timestamp, src_host, user, parent_process_name, command_line, risk_score, risk_factors

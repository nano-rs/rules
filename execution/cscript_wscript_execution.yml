---
title: cscript_wscript_suspicious_execution
description: Detects cscript/wscript executing scripts from suspicious locations or with suspicious arguments.
author: nano.rs
severity: medium
mode: live
detection_mode: scheduled
schedule: "*/3 * * * *"
lookback: 5m
folder: endpoint
mitre_tactics:
  - TA0002
mitre_techniques:
  - T1059.005
  - T1059.007
tags:
  - wscript
  - cscript
  - scripting
  - windows
ai_triage_hints:
  ignore_when:
    - "Script is a known login or GPO script"
    - "Script path is in a managed deployment folder"
  suspicious_when:
    - "Script executed from Temp or user profile"
    - "Script has obfuscated name or random characters"
---
source_type=windows_sysmon OR source_type=endpoint_edr
| where event_type="process_create"
| where process_name IN ("cscript.exe", "wscript.exe")
| where command_line CONTAINS "Temp" OR command_line CONTAINS "AppData" OR command_line CONTAINS "Downloads"
| eval esc_office_parent_process=(lower(parent_process_name)="winword.exe" OR lower(parent_process_name)="excel.exe" OR lower(parent_process_name)="outlook.exe" OR lower(parent_process_name)="powerpnt.exe")
| eval esc_explicit_script_engine=(lower(command_line) CONTAINS "//e:jscript" OR lower(command_line) CONTAINS "//e:vbscript")
| risk score=min(100, 55 + if(esc_office_parent_process, 30, 0) + if(esc_explicit_script_engine, 15, 0)) entity=src_host factor=concat("Script from suspicious path", if(esc_office_parent_process, "; Office parent process", ""), if(esc_explicit_script_engine, "; Explicit script engine", ""))
| table timestamp, src_host, user, process_name, parent_process_name, command_line, risk_score, risk_factors

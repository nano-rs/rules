---
title: cscript_wscript_suspicious_execution
description: Detects cscript/wscript executing scripts from suspicious locations or with suspicious arguments.
author: nano.rs
severity: medium
mode: live
detection_mode: scheduled
schedule: "*/3 * * * *"
lookback: 5m
folder: endpoint
mitre_tactics:
  - TA0002
mitre_techniques:
  - T1059.005
  - T1059.007
tags:
  - wscript
  - cscript
  - scripting
  - windows
ai_triage_hints:
  ignore_when:
    - "Script is a known login or GPO script"
    - "Script path is in a managed deployment folder"
  suspicious_when:
    - "Script executed from Temp or user profile"
    - "Script has obfuscated name or random characters"
---
metadata.log_source="windows_sysmon" OR metadata.log_source="endpoint_edr"
| where class_uid=1007 AND activity_id=1
| where process.name IN ("cscript.exe", "wscript.exe")
| where process.cmd_line CONTAINS "Temp" OR process.cmd_line CONTAINS "AppData" OR process.cmd_line CONTAINS "Downloads"
| risk score=55 entity=device.hostname factor="Script from suspicious path"
| risk score=if(lower(actor.process.name)="winword.exe" OR lower(actor.process.name)="excel.exe" OR lower(actor.process.name)="outlook.exe" OR lower(actor.process.name)="powerpnt.exe", 30, 0) factor=if(lower(actor.process.name)="winword.exe" OR lower(actor.process.name)="excel.exe" OR lower(actor.process.name)="outlook.exe" OR lower(actor.process.name)="powerpnt.exe", "Office parent process", null())
| risk score=if(match(process.cmd_line, "(?i)//e:(jscript|vbscript)"), 15, 0) factor=if(match(process.cmd_line, "(?i)//e:(jscript|vbscript)"), "Explicit script engine", null())
| table time, device.hostname, actor.user.name, process.name, actor.process.name, process.cmd_line, risk_score, risk_factors

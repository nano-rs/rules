---
title: wmic_remote_process_creation
description: Detects WMIC being used to create processes on remote systems, a common lateral movement and execution technique.
author: nano.rs
severity: high
mode: live
detection_mode: scheduled
schedule: "*/2 * * * *"
lookback: 5m
folder: endpoint
mitre_tactics:
  - TA0002
mitre_techniques:
  - T1047
tags:
  - wmic
  - windows
  - remote_execution
ai_triage_hints:
  ignore_when:
    - "WMIC call is from SCCM or other management tools"
    - "User is IT admin performing remote maintenance"
  suspicious_when:
    - "Target is a sensitive server or domain controller"
    - "Process created is scripting engine or shell"
---
metadata.log_source="windows_sysmon" OR metadata.log_source="endpoint_edr"
| where class_uid=1007 AND activity_id=1
| where process.name="wmic.exe"
| where process.cmd_line CONTAINS "/node:" AND process.cmd_line CONTAINS "process" AND process.cmd_line CONTAINS "call" AND process.cmd_line CONTAINS "create"
| eval esc_shell_spawned_via_wmic=(lower(process.cmd_line) CONTAINS "powershell" OR lower(process.cmd_line) CONTAINS "cmd.exe")
| risk score=min(100, 75 + if(esc_shell_spawned_via_wmic, 15, 0)) entity=device.hostname factor=concat("Remote WMIC process creation", if(esc_shell_spawned_via_wmic, "; Shell spawned via WMIC", ""))
| table time, device.hostname, actor.user.name, process.cmd_line, risk_score, risk_factors

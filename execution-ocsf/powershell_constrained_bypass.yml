---
title: powershell_constrained_language_bypass
description: Detects attempts to bypass PowerShell Constrained Language Mode using known techniques.
author: nano.rs
severity: high
mode: live
detection_mode: scheduled
schedule: "*/2 * * * *"
lookback: 5m
folder: endpoint
mitre_tactics:
  - TA0002
  - TA0112
mitre_techniques:
  - T1059.001
  - T1685
tags:
  - powershell
  - bypass
  - windows
ai_triage_hints:
  ignore_when:
    - "Developer testing PowerShell scripts in full language mode"
  suspicious_when:
    - "Multiple bypass techniques in single session"
    - "Followed by suspicious script execution"
---
metadata.log_source="windows_sysmon" OR metadata.log_source="endpoint_edr"
| where class_uid=1007 AND activity_id=1
| where process.name="powershell.exe" OR process.name="pwsh.exe"
| where process.cmd_line CONTAINS "__PSLockdownPolicy" OR process.cmd_line CONTAINS "FullLanguage" OR process.cmd_line CONTAINS "LanguageMode" OR process.cmd_line CONTAINS "Set-ExecutionPolicy Bypass"
| risk score=80 entity=device.hostname factor="CLM bypass attempt"
| where process.cmd_line CONTAINS "Add-Type" OR process.cmd_line CONTAINS "[Reflection.Assembly]"
| risk score=90 factor="Reflection-based bypass"
| table time, device.hostname, actor.user.name, process.cmd_line, risk_score, unmapped.risk_factors

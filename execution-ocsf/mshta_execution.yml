---
title: mshta_suspicious_execution
description: Detects mshta.exe executing HTA files from suspicious locations or with inline scripts.
author: nano.rs
severity: high
mode: live
detection_mode: scheduled
schedule: "*/2 * * * *"
lookback: 5m
folder: endpoint
mitre_tactics:
  - TA0005
mitre_techniques:
  - T1218.005
tags:
  - mshta
  - lolbin
  - windows
ai_triage_hints:
  ignore_when:
    - "HTA file is part of known enterprise application"
    - "Execution is from trusted internal path"
  suspicious_when:
    - "HTA loaded from URL or temp directory"
    - "Inline VBScript or JavaScript in command line"
---
metadata.log_source="windows_sysmon" OR metadata.log_source="endpoint_edr"
| where class_uid=1007 AND activity_id=1
| where process.name="mshta.exe"
| where process.cmd_line CONTAINS "http" OR process.cmd_line CONTAINS "javascript:" OR process.cmd_line CONTAINS "vbscript:" OR process.cmd_line CONTAINS "Temp"
| eval esc_remote_hta_execution=(lower(process.cmd_line) CONTAINS "http://" OR lower(process.cmd_line) CONTAINS "https://")
| eval esc_office_parent_process=(lower(actor.process.name)="winword.exe" OR lower(actor.process.name)="excel.exe" OR lower(actor.process.name)="outlook.exe")
| risk score=min(100, 70 + if(esc_remote_hta_execution, 15, 0) + if(esc_office_parent_process, 25, 0)) entity=device.hostname factor=concat("Suspicious mshta execution", if(esc_remote_hta_execution, "; Remote HTA execution", ""), if(esc_office_parent_process, "; Office parent process", ""))
| table time, device.hostname, actor.user.name, actor.process.name, process.cmd_line, risk_score, risk_factors

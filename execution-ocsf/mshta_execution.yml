---
title: mshta_suspicious_execution
description: Detects mshta.exe executing HTA files from suspicious locations or with inline scripts.
author: nano.rs
severity: high
mode: live
detection_mode: scheduled
schedule: "*/2 * * * *"
lookback: 5m
folder: endpoint
mitre_tactics:
  - TA0005
mitre_techniques:
  - T1218.005
tags:
  - mshta
  - lolbin
  - windows
ai_triage_hints:
  ignore_when:
    - "HTA file is part of known enterprise application"
    - "Execution is from trusted internal path"
  suspicious_when:
    - "HTA loaded from URL or temp directory"
    - "Inline VBScript or JavaScript in command line"
---
metadata.log_source="windows_sysmon" OR metadata.log_source="endpoint_edr"
| where class_uid=1007 AND activity_id=1
| where process.name="mshta.exe"
| where process.cmd_line CONTAINS "http" OR process.cmd_line CONTAINS "javascript:" OR process.cmd_line CONTAINS "vbscript:" OR process.cmd_line CONTAINS "Temp"
| risk score=70 entity=device.hostname factor="Suspicious mshta execution"
| where process.cmd_line CONTAINS "http://" OR process.cmd_line CONTAINS "https://"
| risk score=85 factor="Remote HTA execution"
| where actor.process.name IN ("winword.exe", "excel.exe", "outlook.exe")
| risk score=95 factor="Office parent process"
| table time, device.hostname, actor.user.name, actor.process.name, process.cmd_line, risk_score, unmapped.risk_factors

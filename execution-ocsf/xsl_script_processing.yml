---
title: xsl_script_processing
description: Detects msxsl.exe or wmic executing XSL stylesheets, which can contain embedded scripts for code execution.
author: nano.rs
severity: high
mode: live
detection_mode: scheduled
schedule: "*/3 * * * *"
lookback: 5m
folder: endpoint
mitre_tactics:
  - TA0005
mitre_techniques:
  - T1220
tags:
  - xsl
  - lolbin
  - windows
ai_triage_hints:
  ignore_when:
    - "XSL processing is part of known application workflow"
  suspicious_when:
    - "XSL file is from temp or user-writable directory"
    - "WMIC format parameter points to remote XSL"
---
metadata.log_source="windows_sysmon" OR metadata.log_source="endpoint_edr"
| where class_uid=1007 AND activity_id=1
| where (process.name="msxsl.exe") OR (process.name="wmic.exe" AND process.cmd_line CONTAINS "/format:")
| where process.cmd_line CONTAINS ".xsl"
| eval esc_remote_xsl=(lower(process.cmd_line) CONTAINS "http")
| risk score=min(100, 80 + if(esc_remote_xsl, 10, 0)) entity=device.hostname factor=concat("XSL script processing", if(esc_remote_xsl, "; Remote XSL", ""))
| table time, device.hostname, actor.user.name, process.name, process.cmd_line, risk_score, risk_factors

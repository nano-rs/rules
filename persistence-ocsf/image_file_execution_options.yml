---
title: image_file_execution_options_debugger
description: Detects setting of Image File Execution Options debugger keys, used to hijack process execution.
author: nano.rs
severity: high
mode: live
detection_mode: scheduled
schedule: "*/5 * * * *"
lookback: 10m
folder: endpoint
mitre_tactics:
  - TA0003
  - TA0004
mitre_techniques:
  - T1546.012
tags:
  - ifeo
  - registry
  - persistence
  - windows
ai_triage_hints:
  ignore_when:
    - "Debugger is a known development tool (Visual Studio, WinDbg)"
    - "Set by IT for application compatibility"
  suspicious_when:
    - "Debugger points to cmd.exe or powershell.exe"
    - "Target is accessibility tool (sethc.exe, utilman.exe)"
---
metadata.log_source="windows_sysmon"
| where class_uid=201001 OR class_uid=201002
| where reg_key.path CONTAINS "Image File Execution Options" OR reg_value.path CONTAINS "Image File Execution Options"
| where reg_key.path CONTAINS "Debugger" OR reg_value.name="Debugger" OR reg_value.path CONTAINS "Debugger"
| risk score=75 entity=device.hostname factor="IFEO debugger set"
| where reg_key.path CONTAINS "sethc.exe" OR reg_key.path CONTAINS "utilman.exe" OR reg_key.path CONTAINS "osk.exe" OR reg_key.path CONTAINS "narrator.exe" OR reg_value.path CONTAINS "sethc.exe" OR reg_value.path CONTAINS "utilman.exe" OR reg_value.path CONTAINS "osk.exe" OR reg_value.path CONTAINS "narrator.exe"
| risk score=95 factor="Accessibility tool hijack"
| table time, device.hostname, actor.user.name, reg_key.path, reg_value.path, reg_value.name, reg_value.data, actor.process.name, risk_score, unmapped.risk_factors

---
title: suspicious_browser_extension_installation
description: Detects installation of browser extensions outside of normal web store flow, potentially malicious.
author: nano.rs
severity: medium
mode: live
detection_mode: scheduled
schedule: "*/10 * * * *"
lookback: 30m
folder: endpoint
mitre_tactics:
  - TA0003
mitre_techniques:
  - T1176
tags:
  - browser
  - extension
  - persistence
ai_triage_hints:
  ignore_when:
    - "Extension installed via enterprise GPO policy"
    - "Known security or productivity extension"
  suspicious_when:
    - "Extension installed via command line or script"
    - "Extension files have low prevalence"
---
metadata.log_source="endpoint_edr" OR metadata.log_source="windows_sysmon"
| where class_uid=1001 AND activity_id=1
| where file.path CONTAINS "\\Extensions\\" AND file.path CONTAINS "manifest.json"
| where actor.process.name NOT IN ("chrome.exe", "msedge.exe", "firefox.exe")
| risk score=65 entity=device.hostname factor="Extension installed outside browser"
| where actor.process.name IN ("powershell.exe", "cmd.exe", "wscript.exe")
| risk score=85 factor="Script installed extension"
| table time, device.hostname, actor.user.name, file.path, actor.process.name, risk_score, unmapped.risk_factors

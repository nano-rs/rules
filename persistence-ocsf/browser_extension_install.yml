---
title: suspicious_browser_extension_installation
description: Detects installation of browser extensions outside of normal web store flow, potentially malicious.
author: nano.rs
severity: medium
mode: live
detection_mode: scheduled
schedule: "*/10 * * * *"
lookback: 30m
folder: endpoint
mitre_tactics:
  - TA0003
mitre_techniques:
  - T1176
tags:
  - browser
  - extension
  - persistence
ai_triage_hints:
  ignore_when:
    - "Extension installed via enterprise GPO policy"
    - "Known security or productivity extension"
  suspicious_when:
    - "Extension installed via command line or script"
    - "Extension files have low prevalence"
---
metadata.log_source="endpoint_edr" OR metadata.log_source="windows_sysmon"
| where class_uid=1001 AND activity_id=1
| where file.path CONTAINS "\\Extensions\\" AND file.path CONTAINS "manifest.json"
| where actor.process.name NOT IN ("chrome.exe", "msedge.exe", "firefox.exe")
| eval esc_script_installed_extension=(lower(actor.process.name)="powershell.exe" OR lower(actor.process.name)="cmd.exe" OR lower(actor.process.name)="wscript.exe")
| risk score=min(100, 65 + if(esc_script_installed_extension, 20, 0)) entity=device.hostname factor=concat("Extension installed outside browser", if(esc_script_installed_extension, "; Script installed extension", ""))
| table time, device.hostname, actor.user.name, file.path, actor.process.name, risk_score, risk_factors

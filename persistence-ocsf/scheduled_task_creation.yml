---
title: suspicious_scheduled_task_creation
description: Detects creation of scheduled tasks with suspicious characteristics such as execution from temp directories, encoded PowerShell, or tasks created by unusual parent processes.
author: nano.rs
severity: medium
mode: staging
detection_mode: scheduled
schedule: "*/5 * * * *"
lookback: 15m
folder: endpoint
mitre_tactics:
  - TA0003
  - TA0002
mitre_techniques:
  - T1053.005
tags:
  - persistence
  - scheduled_task
  - windows
ai_triage_hints:
  ignore_when:
    - "Task is created by SCCM, GPO, or enterprise management"
    - "Task name matches known software update patterns"
    - "Created by signed Microsoft or vendor binary"
  suspicious_when:
    - "Task runs executable from temp or user-writable directory"
    - "Task name is random or obfuscated"
    - "Parent process is scripting engine or Office app"
    - "Task triggers on system events rather than schedule"
---
metadata.log_source="windows_sysmon" OR metadata.log_source="windows_security"
| where metadata.event_code="4698" OR process.name="schtasks.exe"
| risk score=45 entity=device.hostname factor="Scheduled task created"
| risk score=if(match(process.cmd_line, "(?i)temp|appdata|programdata") OR match(message, "(?i)temp|appdata|programdata"), 25, 0) factor=if(match(process.cmd_line, "(?i)temp|appdata|programdata") OR match(message, "(?i)temp|appdata|programdata"), "Suspicious execution path", null())
| risk score=if(match(process.cmd_line, "(?i)-enc") OR match(message, "(?i)-enc"), 40, 0) factor=if(match(process.cmd_line, "(?i)-enc") OR match(message, "(?i)-enc"), "Encoded command in task", null())
| risk score=if(lower(actor.process.name)="wscript.exe" OR lower(actor.process.name)="cscript.exe" OR lower(actor.process.name)="mshta.exe", 35, 0) factor=if(lower(actor.process.name)="wscript.exe" OR lower(actor.process.name)="cscript.exe" OR lower(actor.process.name)="mshta.exe", "Script engine parent", null())
| risk score=if(lower(actor.process.name)="winword.exe" OR lower(actor.process.name)="excel.exe" OR lower(actor.process.name)="powerpnt.exe", 45, 0) factor=if(lower(actor.process.name)="winword.exe" OR lower(actor.process.name)="excel.exe" OR lower(actor.process.name)="powerpnt.exe", "Office app parent", null())
| table time, device.hostname, actor.user.name, process.name, actor.process.name, process.cmd_line, risk_score, risk_factors

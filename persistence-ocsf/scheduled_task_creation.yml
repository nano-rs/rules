---
title: suspicious_scheduled_task_creation
description: Detects creation of scheduled tasks with suspicious characteristics such as execution from temp directories, encoded PowerShell, or tasks created by unusual parent processes.
author: nano.rs
severity: medium
mode: staging
detection_mode: scheduled
schedule: "*/5 * * * *"
lookback: 15m
folder: endpoint
mitre_tactics:
  - TA0003
  - TA0002
mitre_techniques:
  - T1053.005
tags:
  - persistence
  - scheduled_task
  - windows
ai_triage_hints:
  ignore_when:
    - "Task is created by SCCM, GPO, or enterprise management"
    - "Task name matches known software update patterns"
    - "Created by signed Microsoft or vendor binary"
  suspicious_when:
    - "Task runs executable from temp or user-writable directory"
    - "Task name is random or obfuscated"
    - "Parent process is scripting engine or Office app"
    - "Task triggers on system events rather than schedule"
---
metadata.log_source="windows_sysmon" OR metadata.log_source="windows_security"
| where metadata.event_code="4698" OR process.name="schtasks.exe"
| eval esc_suspicious_execution_path=(match(process.cmd_line, "(?i)temp|appdata|programdata") OR match(message, "(?i)temp|appdata|programdata"))
| eval esc_encoded_command_in_task=(match(process.cmd_line, "(?i)-enc") OR match(message, "(?i)-enc"))
| eval esc_script_engine_parent=(lower(actor.process.name)="wscript.exe" OR lower(actor.process.name)="cscript.exe" OR lower(actor.process.name)="mshta.exe")
| eval esc_office_app_parent=(lower(actor.process.name)="winword.exe" OR lower(actor.process.name)="excel.exe" OR lower(actor.process.name)="powerpnt.exe")
| risk score=min(100, 45 + if(esc_suspicious_execution_path, 25, 0) + if(esc_encoded_command_in_task, 40, 0) + if(esc_script_engine_parent, 35, 0) + if(esc_office_app_parent, 45, 0)) entity=device.hostname factor=concat("Scheduled task created", if(esc_suspicious_execution_path, "; Suspicious execution path", ""), if(esc_encoded_command_in_task, "; Encoded command in task", ""), if(esc_script_engine_parent, "; Script engine parent", ""), if(esc_office_app_parent, "; Office app parent", ""))
| table time, device.hostname, actor.user.name, process.name, actor.process.name, process.cmd_line, risk_score, risk_factors

---
title: additional_cloud_credentials
description: Detects an actor adding new long-term credentials (IAM access keys, login profiles/passwords) to cloud identities in AWS CloudTrail. Adversaries add credentials to existing users, roles, or service principals to maintain persistent access and escalate privileges, often creating keys for an account other than their own.
author: nano.rs
severity: high
mode: staging
detection_mode: scheduled
schedule: "*/5 * * * *"
lookback: 15m
folder: cloud
mitre_tactics:
  - TA0003
  - TA0004
mitre_techniques:
  - T1098.001
tags:
  - cloud
  - aws
  - iam
  - persistence
  - credential-add
ai_triage_hints:
  ignore_when:
    - "Known IAM automation, onboarding workflow, or CI/CD pipeline rotating keys"
    - "User creating an access key for their own account as part of expected self-service"
  suspicious_when:
    - "Actor creates access keys or login profiles for many distinct target users"
    - "Credentials added to a privileged or service account"
    - "Source IP is outside the corporate network or from an unusual region"
    - "Credential creation follows recent AccessDeniedException enumeration by the same actor"
    - "No MFA used for the session"
---
metadata.log_source="aws_cloudtrail" status="Success" (api.operation="CreateAccessKey" OR api.operation="CreateLoginProfile" OR api.operation="UpdateLoginProfile")
| stats count() as cred_adds, dc(api.operation) as op_types, values(api.operation) as operations, values(src_endpoint.ip) as source_ips, min(time) as first_seen, max(time) as last_seen by actor.user.name, actor.user.uid
| risk score=70 entity=actor.user.uid factor="Added long-term cloud credentials (T1098.001)"
| where cred_adds > 2
| risk score=90 factor="Repeated credential additions across cloud identities"
| table first_seen, last_seen, actor.user.name, actor.user.uid, cred_adds, operations, source_ips, risk_score

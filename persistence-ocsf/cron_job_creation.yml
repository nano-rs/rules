---
title: suspicious_cron_job_creation
description: Detects creation of cron jobs with suspicious commands or by unusual processes.
author: nano.rs
severity: medium
mode: live
detection_mode: scheduled
schedule: "*/5 * * * *"
lookback: 15m
folder: endpoint
mitre_tactics:
  - TA0003
  - TA0002
mitre_techniques:
  - T1053.003
tags:
  - cron
  - linux
  - persistence
ai_triage_hints:
  ignore_when:
    - "Cron job is from package manager or system update"
    - "Known automation tool creating scheduled task"
  suspicious_when:
    - "Cron command includes network activity (curl, wget)"
    - "Cron command runs encoded or obfuscated script"
---
metadata.log_source="linux_audit" OR metadata.log_source="endpoint_edr"
| where (class_uid=1007 AND activity_id=1 AND process.name="crontab") OR (class_uid=1001 AND (file.path CONTAINS "/cron.d/" OR file.path CONTAINS "/crontab"))
| eval esc_network_command_in_cron=(lower(process.cmd_line) CONTAINS "curl" OR lower(process.cmd_line) CONTAINS "wget" OR lower(process.cmd_line) CONTAINS "nc " OR lower(process.cmd_line) CONTAINS "python" OR lower(actor.process.cmd_line) CONTAINS "curl" OR lower(actor.process.cmd_line) CONTAINS "wget" OR lower(actor.process.cmd_line) CONTAINS "nc " OR lower(actor.process.cmd_line) CONTAINS "python")
| eval esc_encoded_or_piped_execution=(lower(process.cmd_line) CONTAINS "base64" OR lower(process.cmd_line) CONTAINS "|sh" OR lower(process.cmd_line) CONTAINS "|bash" OR lower(actor.process.cmd_line) CONTAINS "base64" OR lower(actor.process.cmd_line) CONTAINS "|sh" OR lower(actor.process.cmd_line) CONTAINS "|bash")
| risk score=min(100, 45 + if(esc_network_command_in_cron, 30, 0) + if(esc_encoded_or_piped_execution, 40, 0)) entity=device.hostname factor=concat("Cron job modified", if(esc_network_command_in_cron, "; Network command in cron", ""), if(esc_encoded_or_piped_execution, "; Encoded or piped execution", ""))
| table time, device.hostname, actor.user.name, process.cmd_line, actor.process.cmd_line, file.path, risk_score, risk_factors

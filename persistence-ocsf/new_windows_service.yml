---
title: new_suspicious_windows_service
description: Detects creation of new Windows services with suspicious characteristics.
author: nano.rs
severity: medium
mode: live
detection_mode: scheduled
schedule: "*/5 * * * *"
lookback: 15m
folder: endpoint
mitre_tactics:
  - TA0003
mitre_techniques:
  - T1543.003
tags:
  - service
  - persistence
  - windows
ai_triage_hints:
  ignore_when:
    - "Service is from known software installation"
    - "Service binary is in Program Files with valid signature"
  suspicious_when:
    - "Service binary in temp or user-writable path"
    - "Service created by cmd.exe or powershell"
---
metadata.log_source="windows_sysmon" OR metadata.log_source="windows_security"
| where metadata.event_code IN ("4697", "7045") OR process.name="sc.exe"
| risk score=50 entity=device.hostname factor="New service created"
| where process.cmd_line CONTAINS "Temp" OR process.cmd_line CONTAINS "AppData" OR process.cmd_line CONTAINS "ProgramData" OR message CONTAINS "Temp" OR message CONTAINS "AppData" OR message CONTAINS "ProgramData"
| risk score=75 factor="Suspicious binary path"
| where process.cmd_line CONTAINS "powershell" OR process.cmd_line CONTAINS "cmd /c" OR message CONTAINS "powershell" OR message CONTAINS "cmd /c"
| risk score=85 factor="Shell in service command"
| table time, device.hostname, actor.user.name, process.name, process.cmd_line, metadata.event_code, risk_score, unmapped.risk_factors

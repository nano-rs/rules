---
title: wmi_remote_execution
description: Detects WMI being used for remote process creation across the network.
author: nano.rs
severity: high
mode: live
detection_mode: scheduled
schedule: "*/3 * * * *"
lookback: 10m
folder: endpoint
mitre_tactics:
  - TA0008
mitre_techniques:
  - T1021.006
tags:
  - wmi
  - remote_execution
  - windows
ai_triage_hints:
  ignore_when:
    - "Known management tool using WMI remotely"
    - "SCCM or MDM agent activity"
  suspicious_when:
    - "WMI creating processes on remote hosts"
    - "Target is sensitive server"
---
source_type=windows_sysmon OR source_type=endpoint_edr
| where event_type="process_create"
| where parent_process_name="wmiprvse.exe"
| where process_name IN ("cmd.exe", "powershell.exe", "pwsh.exe", "mshta.exe", "rundll32.exe")
| eval esc_suspicious_wmi_payload=(lower(command_line) CONTAINS "-enc" OR lower(command_line) CONTAINS "iex" OR lower(command_line) CONTAINS "downloadstring")
| risk score=min(100, 70 + if(esc_suspicious_wmi_payload, 20, 0)) entity=src_host factor=concat("WMI remote execution", if(esc_suspicious_wmi_payload, "; Suspicious WMI payload", ""))
| table timestamp, src_host, user, process_name, command_line, risk_score, risk_factors

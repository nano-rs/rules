---
title: dcom_lateral_movement
description: Detects DCOM-based lateral movement using MMC, ShellBrowserWindow, or other DCOM objects.
author: nano.rs
severity: high
mode: live
detection_mode: scheduled
schedule: "*/3 * * * *"
lookback: 10m
folder: endpoint
mitre_tactics:
  - TA0008
mitre_techniques:
  - T1021.003
tags:
  - dcom
  - lateral_movement
  - windows
ai_triage_hints:
  ignore_when:
    - "Known management tool using DCOM"
    - "MMC launched by administrator locally"
  suspicious_when:
    - "DCOM spawning shell on remote host"
    - "Unusual DCOM application activation"
---
source_type=windows_sysmon OR source_type=endpoint_edr
| where event_type="process_create"
| where parent_process_name="mmc.exe" OR parent_process_name="explorer.exe"
| where process_name IN ("cmd.exe", "powershell.exe") AND command_line CONTAINS "\\*"
| eval esc_suspicious_dcom_payload=(lower(command_line) CONTAINS "-enc" OR lower(command_line) CONTAINS "iex")
| risk score=min(100, 70 + if(esc_suspicious_dcom_payload, 15, 0)) entity=src_host factor=concat("Potential DCOM lateral movement", if(esc_suspicious_dcom_payload, "; Suspicious DCOM payload", ""))
| table timestamp, src_host, user, parent_process_name, process_name, command_line, risk_score, risk_factors

---
title: rdp_lateral_movement_pattern
description: Detects RDP connections between internal hosts that may indicate lateral movement.
author: nano.rs
severity: medium
mode: live
detection_mode: scheduled
schedule: "*/5 * * * *"
lookback: 30m
folder: network
mitre_tactics:
  - TA0008
mitre_techniques:
  - T1021.001
tags:
  - rdp
  - remote_desktop
  - lateral_movement
ai_triage_hints:
  ignore_when:
    - "IT admin connecting to managed servers"
    - "Known jump box / bastion host usage"
  suspicious_when:
    - "RDP from workstation to workstation"
    - "First-time RDP connection for this user-host pair"
---
source_type=firewall OR source_type=network_flow OR source_type=windows_security
| where dest_port=3389 AND event_type="network_connect"
| where is_private_ip(src_ip) AND is_private_ip(dest_ip)
| prevalence enrich=true window=30d
| where host_count < 5
| eval esc_first_seen_rdp_connection=(host_count < 2)
| risk score=min(100, 55 + if(esc_first_seen_rdp_connection, 20, 0)) entity=src_ip factor=concat("Uncommon internal RDP", if(esc_first_seen_rdp_connection, "; First-seen RDP connection", ""))
| table timestamp, src_ip, src_host, user, dest_ip, dest_host, host_count, risk_score, risk_factors

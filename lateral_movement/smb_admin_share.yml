---
title: smb_admin_share_access
description: Detects access to administrative SMB shares (C$, ADMIN$, IPC$) which may indicate lateral movement.
author: nano.rs
severity: medium
mode: live
detection_mode: scheduled
schedule: "*/5 * * * *"
lookback: 15m
folder: network
mitre_tactics:
  - TA0008
mitre_techniques:
  - T1021.002
tags:
  - smb
  - admin_share
  - lateral_movement
  - windows
ai_triage_hints:
  ignore_when:
    - "IT admin accessing remote admin shares"
    - "Known backup or management tool"
  suspicious_when:
    - "Access from workstation to server admin shares"
    - "First-time admin share access for this user"
---
source_type=windows_security OR source_type=endpoint_edr
| where event_type="share_access"
| where message CONTAINS "C$" OR message CONTAINS "ADMIN$" OR message CONTAINS "IPC$"
| prevalence enrich=true window=30d
| eval esc_workstation_accessing_admin_share=(lower(src_host) CONTAINS "ws" OR lower(src_host) CONTAINS "desktop" OR lower(src_host) CONTAINS "laptop")
| eval esc_unusual_admin_share_access=(host_count < 5)
| risk score=min(100, 45 + if(esc_workstation_accessing_admin_share, 20, 0) + if(esc_unusual_admin_share_access, 35, 0)) entity=src_host factor=concat("Admin share access", if(esc_workstation_accessing_admin_share, "; Workstation accessing admin share", ""), if(esc_unusual_admin_share_access, "; Unusual admin share access", ""))
| table timestamp, src_host, src_ip, user, dest_host, message, host_count, risk_score, risk_factors

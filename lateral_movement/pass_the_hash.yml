---
title: pass_the_hash_detection
description: Detects indicators of Pass-the-Hash attacks based on NTLM authentication anomalies.
author: nano.rs
severity: high
mode: live
detection_mode: scheduled
schedule: "*/3 * * * *"
lookback: 10m
folder: identity
mitre_tactics:
  - TA0008
mitre_techniques:
  - T1550.002
tags:
  - pth
  - ntlm
  - lateral_movement
ai_triage_hints:
  ignore_when:
    - "Service account with known NTLM usage"
    - "Legacy application requiring NTLM"
  suspicious_when:
    - "NTLM auth when Kerberos is expected"
    - "Admin account using NTLM from workstation"
---
source_type=windows_security OR source_type=auth_logs
| where event_type="login" AND auth_type="ntlm" AND status="success"
| where user CONTAINS "admin" OR user CONTAINS "svc"
| eval esc_admin_ntlm_from_workstation=(lower(src_host) CONTAINS "ws" OR lower(src_host) CONTAINS "desktop")
| risk score=min(100, 60 + if(esc_admin_ntlm_from_workstation, 20, 0)) entity=user factor=concat("NTLM auth for privileged account", if(esc_admin_ntlm_from_workstation, "; Admin NTLM from workstation", ""))
| table timestamp, user, src_ip, src_host, dest_host, auth_type, risk_score, risk_factors

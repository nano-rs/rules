---
title: credential_stuffing_attack
description: Detects credential stuffing attacks where multiple failed login attempts are followed by a successful login from the same source IP and user combination, characteristic of automated credential testing tools.
author: nano.rs
severity: high
mode: staging
detection_mode: scheduled
schedule: "*/5 * * * *"
lookback: 15m
folder: identity
mitre_tactics:
  - TA0006
mitre_techniques:
  - T1110.004
tags:
  - authentication
  - brute_force
  - sequence
ai_triage_hints:
  ignore_when:
    - "User recently requested a password reset"
    - "Source IP is a corporate VPN exit node with multiple users"
    - "Account is a shared service account with expected auth patterns"
  suspicious_when:
    - "Failed attempts use different passwords (visible in auth logs)"
    - "Source IP is from a hosting provider or VPN service"
    - "Activity occurs outside normal business hours"
    - "Multiple users targeted from the same source IP"
---
metadata.log_source IN ("auth_logs", "okta", "azure_ad", "windows_event") class_uid=3002
| sequence by user.name, src_endpoint.ip maxspan=5m
    fields(auth_protocol, logon_type, src_endpoint.location.country, is_mfa)
    [activity_id=1 status="Failure"]
    [activity_id=1 status="Failure"]
    [activity_id=1 status="Failure"]
    [activity_id=1 status="Success"]
| eval esc_foreign_source=(lower(step4_src_endpoint_location_country)!="us" AND lower(step4_src_endpoint_location_country)!="")
| eval esc_rapid_sequence=(sequence_duration_seconds < 60)
| risk score=min(100, 70 + if(esc_foreign_source, 15, 0) + if(esc_rapid_sequence, 20, 0)) entity=user.name factor=concat("Credential stuffing pattern", if(esc_foreign_source, "; Foreign source", ""), if(esc_rapid_sequence, "; Rapid sequence", ""))
| table time, user.name, src_endpoint.ip, step4_src_endpoint_location_country, step4_auth_protocol, sequence_duration_seconds, risk_score, risk_factors

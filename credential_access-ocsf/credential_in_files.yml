---
title: credential_search_in_files
description: Detects searching for credentials in files using findstr, grep, or similar tools.
author: nano.rs
severity: medium
mode: live
detection_mode: scheduled
schedule: "*/5 * * * *"
lookback: 15m
folder: endpoint
mitre_tactics:
  - TA0006
mitre_techniques:
  - T1552.001
tags:
  - credential_search
  - files
  - cross_platform
ai_triage_hints:
  ignore_when:
    - "Developer searching their own code"
    - "Security audit tool scanning for exposed credentials"
  suspicious_when:
    - "Search includes password, secret, key patterns"
    - "Search targets configuration files"
---
metadata.log_source IN ("windows_sysmon", "endpoint_edr") class_uid=1007 activity_id=1
| where process.name IN ("findstr.exe", "find.exe", "select-string", "grep")
| where process.cmd_line CONTAINS "password" OR process.cmd_line CONTAINS "secret" OR process.cmd_line CONTAINS "credential" OR process.cmd_line CONTAINS "api_key" OR process.cmd_line CONTAINS "token"
| risk score=50 entity=device.hostname factor="Credential search in files"
| where process.cmd_line CONTAINS "/s" OR process.cmd_line CONTAINS "-r"
| risk score=70 factor="Recursive credential search"
| table time, device.hostname, actor.user.name, process.name, process.cmd_line, risk_score, risk_factors

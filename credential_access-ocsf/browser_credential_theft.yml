---
title: browser_credential_store_access
description: Detects access to browser credential stores (Chrome Login Data, Firefox logins.json). OCSF File System Activity has no `copy` activity, so the UDM read-or-copy test becomes Read (2) or Open (14).
author: nano.rs
severity: high
mode: live
detection_mode: scheduled
schedule: "*/3 * * * *"
lookback: 10m
folder: endpoint
mitre_tactics:
  - TA0006
mitre_techniques:
  - T1555.003
tags:
  - browser
  - credential_theft
  - cross_platform
ai_triage_hints:
  ignore_when:
    - "Browser process accessing its own credential store"
    - "Known password manager syncing credentials"
  suspicious_when:
    - "Non-browser process accessing credential files"
    - "File copied to another location"
---
metadata.log_source IN ("endpoint_edr", "windows_sysmon") class_uid=1001
| where activity_id IN (2, 14)
| where file.path CONTAINS "Login Data" OR file.path CONTAINS "logins.json" OR file.path CONTAINS "Web Data" OR file.path CONTAINS "Cookies"
| where actor.process.name NOT IN ("chrome.exe", "firefox.exe", "msedge.exe", "brave.exe", "opera.exe")
| risk score=80 entity=device.hostname factor="Browser credential access"
| where actor.process.name IN ("powershell.exe", "cmd.exe", "python.exe")
| risk score=90 factor="Script accessing browser creds"
| table time, device.hostname, actor.user.name, actor.process.name, file.path, risk_score, risk_factors

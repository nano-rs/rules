---
title: password_spray_attack
description: Detects password spray attacks where one password is tried against many accounts.
author: nano.rs
severity: high
mode: live
detection_mode: scheduled
schedule: "*/3 * * * *"
lookback: 15m
folder: identity
mitre_tactics:
  - TA0006
mitre_techniques:
  - T1110.003
tags:
  - password_spray
  - brute_force
  - authentication
ai_triage_hints:
  ignore_when:
    - "Failed logins from known vulnerability scanner"
    - "Service account with expired credentials"
  suspicious_when:
    - "Failures across many different accounts from same source"
    - "Attempts during off-hours"
---
metadata.log_source IN ("auth_logs", "okta", "azure_ad", "windows_event") class_uid=3002 activity_id=1 status="Failure"
| stats count, dc(user.name) as unique_users, min(time) as time by src_endpoint.ip
| where count > 20 AND unique_users > 10
| risk score=75 entity=src_endpoint.ip factor="Password spray detected"
| where unique_users > 50
| risk score=90 factor="Large-scale spray"
| table time, src_endpoint.ip, count, unique_users, risk_score, risk_factors

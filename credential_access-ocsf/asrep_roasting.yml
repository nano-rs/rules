---
title: asrep_roasting_activity
description: Detects Kerberos AS-REQ messages for accounts with pre-authentication disabled returning RC4-encrypted AS-REP tickets, indicative of AS-REP Roasting. Attackers request AS-REP material for accounts flagged DONT_REQ_PREAUTH and crack the encrypted blob offline to recover the password.
author: nano.rs
severity: high
mode: live
detection_mode: scheduled
schedule: "*/3 * * * *"
lookback: 15m
folder: identity
mitre_tactics:
  - TA0006
mitre_techniques:
  - T1558.004
tags:
  - kerberos
  - asrep_roasting
  - active_directory
ai_triage_hints:
  ignore_when:
    - "Legacy account that legitimately has pre-authentication disabled"
    - "Application or appliance that requires RC4 Kerberos encryption"
  suspicious_when:
    - "Single source requesting AS-REP material for many users"
    - "AS-REQ for a privileged account with pre-authentication disabled"
---
metadata.log_source IN ("windows_event", "windows_security", "auth_logs") class_uid=3002
| where metadata.event_code="4768" OR auth_protocol_id=2 OR auth_protocol="Kerberos"
| where unmapped.pre_auth_type="0" OR message CONTAINS "Pre-Authentication Type:  0"
| where unmapped.ticket_encryption_type="0x17" OR message CONTAINS "0x17" OR message CONTAINS "RC4"
| stats count, dc(user.name) as unique_targets, min(time) as time by src_endpoint.ip, src_endpoint.hostname
| risk score=75 entity=src_endpoint.hostname factor="AS-REP requested with pre-auth disabled (RC4)"
| where unique_targets > 3
| risk score=90 factor="Likely AS-REP Roasting across multiple accounts"
| table time, src_endpoint.ip, src_endpoint.hostname, count, unique_targets, risk_score, risk_factors

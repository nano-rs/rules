---
title: ntds_dit_file_access
description: Detects access or copying of the NTDS.dit file which contains all Active Directory password hashes.
author: nano.rs
severity: critical
mode: live
detection_mode: scheduled
schedule: "*/1 * * * *"
lookback: 5m
folder: endpoint
mitre_tactics:
  - TA0006
mitre_techniques:
  - T1003.003
tags:
  - ntds
  - active_directory
  - credential_dumping
ai_triage_hints:
  ignore_when:
    - "Authorized backup of domain controller"
    - "Known DR replication process"
  suspicious_when:
    - "ntdsutil or vssadmin used to create shadow copy of ntds.dit"
    - "File copied to non-standard location"
---
metadata.log_source IN ("windows_sysmon", "endpoint_edr") class_uid=1007 activity_id=1
| where (process.cmd_line CONTAINS "ntds.dit") OR (process.name="ntdsutil.exe" AND process.cmd_line CONTAINS "ifm") OR (process.cmd_line CONTAINS "vssadmin" AND process.cmd_line CONTAINS "create shadow")
| risk score=90 entity=device.hostname factor="NTDS.dit access"
| where process.name="ntdsutil.exe" AND process.cmd_line CONTAINS "create full"
| risk score=95 factor="NTDS.dit IFM creation"
| table time, device.hostname, actor.user.name, process.name, process.cmd_line, risk_score, risk_factors

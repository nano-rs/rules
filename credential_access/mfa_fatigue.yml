---
title: mfa_push_notification_fatigue
description: Detects MFA fatigue attacks with repeated push notifications to a user in a short period.
author: nano.rs
severity: high
mode: live
detection_mode: scheduled
schedule: "*/3 * * * *"
lookback: 15m
folder: identity
mitre_tactics:
  - TA0006
mitre_techniques:
  - T1621
tags:
  - mfa
  - fatigue
  - authentication
ai_triage_hints:
  ignore_when:
    - "User having legitimate connectivity issues"
    - "Known MFA migration or testing"
  suspicious_when:
    - "Many push notifications in rapid succession"
    - "Followed by an approval outside normal hours"
---
source_type=okta OR source_type=azure_ad OR source_type=auth_logs
| where event_type="mfa_challenge" OR event_type="mfa_push"
| stats count, min(timestamp) as timestamp by user, src_ip
| where count > 5
| eval esc_severe_mfa_fatigue_attack=(count > 10)
| eval esc_extreme_mfa_bombardment=(count > 20)
| risk score=min(100, 70 + if(esc_severe_mfa_fatigue_attack, 15, 0) + if(esc_extreme_mfa_bombardment, 10, 0)) entity=user factor=concat("MFA push fatigue", if(esc_severe_mfa_fatigue_attack, "; Severe MFA fatigue attack", ""), if(esc_extreme_mfa_bombardment, "; Extreme MFA bombardment", ""))
| table timestamp, user, src_ip, count, risk_score, risk_factors

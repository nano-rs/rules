---
title: usb_mass_storage_data_copy
description: Detects USB mass storage device connections and potential data copy operations.
author: nano.rs
severity: medium
mode: live
detection_mode: scheduled
schedule: "*/5 * * * *"
lookback: 15m
folder: endpoint
mitre_tactics:
  - TA0010
mitre_techniques:
  - T1052.001
tags:
  - usb
  - removable_media
  - exfiltration
ai_triage_hints:
  ignore_when:
    - "Known authorized USB device"
    - "IT admin using USB for system maintenance"
  suspicious_when:
    - "USB device connected to sensitive system"
    - "Large file copies after USB connection"
---
source_type=endpoint_edr OR source_type=windows_sysmon
| where event_type="device_connect" OR event_type="usb_connect"
| where message CONTAINS "Mass Storage" OR message CONTAINS "USBSTOR" OR message CONTAINS "RemovableMedia"
| eval esc_usb_on_server_system=(lower(src_host) CONTAINS "srv" OR lower(src_host) CONTAINS "server" OR lower(src_host) CONTAINS "dc")
| risk score=min(100, 40 + if(esc_usb_on_server_system, 30, 0)) entity=src_host factor=concat("USB mass storage connected", if(esc_usb_on_server_system, "; USB on server system", ""))
| table timestamp, src_host, user, message, risk_score, risk_factors

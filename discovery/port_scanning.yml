---
title: internal_port_scanning
description: Detects internal network port scanning from a single source to many destinations.
author: nano.rs
severity: medium
mode: live
detection_mode: scheduled
schedule: "*/5 * * * *"
lookback: 15m
folder: network
mitre_tactics:
  - TA0007
mitre_techniques:
  - T1046
tags:
  - port_scan
  - network
  - reconnaissance
ai_triage_hints:
  ignore_when:
    - "Known vulnerability scanner (Nessus, Qualys)"
    - "IT performing authorized network scan"
  suspicious_when:
    - "Scanning from workstation, not scanner"
    - "Targeting many ports on single host"
---
source_type=firewall OR source_type=network_flow OR source_type=endpoint_edr
| where event_type="network_connect"
| stats count, dc(dest_ip) as unique_ips, dc(dest_port) as unique_ports, min(timestamp) as timestamp by src_ip
| where (unique_ips > 20 AND unique_ports > 5) OR unique_ports > 50
| eval esc_wide_network_scan=(unique_ips > 50)
| eval esc_extensive_port_enumeration=(unique_ports > 100)
| risk score=min(100, 60 + if(esc_wide_network_scan, 15, 0) + if(esc_extensive_port_enumeration, 25, 0)) entity=src_ip factor=concat("Port scanning detected", if(esc_wide_network_scan, "; Wide network scan", ""), if(esc_extensive_port_enumeration, "; Extensive port enumeration", ""))
| table timestamp, src_ip, unique_ips, unique_ports, count, risk_score, risk_factors

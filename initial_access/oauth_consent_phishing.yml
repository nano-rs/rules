---
title: oauth_consent_phishing
description: Detects OAuth application consent grants from suspicious or newly registered applications.
author: nano.rs
severity: high
mode: live
detection_mode: scheduled
schedule: "*/5 * * * *"
lookback: 15m
folder: identity
mitre_tactics:
  - TA0001
  - TA0008
mitre_techniques:
  - T1566.002
  - T1550.001
tags:
  - oauth
  - consent
  - phishing
  - cloud
ai_triage_hints:
  ignore_when:
    - "Known enterprise application"
    - "IT-approved OAuth consent"
  suspicious_when:
    - "Application requests excessive permissions"
    - "Application registered recently"
---
source_type=azure_ad OR source_type=okta
| where event_type="consent_grant" OR event_type="app_authorize"
| eval esc_sensitive_permissions_granted=(lower(message) CONTAINS "mail.read" OR lower(message) CONTAINS "files.readwrite" OR lower(message) CONTAINS "user.read.all")
| eval esc_unverified_application=(lower(message) CONTAINS "application" AND (lower(message) CONTAINS "verified") = false)
| risk score=min(100, 55 + if(esc_sensitive_permissions_granted, 20, 0) + if(esc_unverified_application, 30, 0)) entity=user factor=concat("OAuth consent granted", if(esc_sensitive_permissions_granted, "; Sensitive permissions granted", ""), if(esc_unverified_application, "; Unverified application", ""))
| table timestamp, user, src_ip, message, risk_score, risk_factors

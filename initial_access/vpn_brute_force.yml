---
title: vpn_brute_force_attempt
description: Detects brute force attacks against VPN endpoints from a single source.
author: nano.rs
severity: high
mode: live
detection_mode: scheduled
schedule: "*/5 * * * *"
lookback: 15m
folder: network
mitre_tactics:
  - TA0006
mitre_techniques:
  - T1110
tags:
  - vpn
  - brute_force
  - perimeter
ai_triage_hints:
  ignore_when:
    - "User with connectivity issues"
    - "Known vulnerability scanner"
  suspicious_when:
    - "Many failures from single IP"
    - "Targeting multiple accounts"
---
source_type=vpn_logs OR source_type=firewall OR source_type=auth_logs
| where event_type="login" AND status="failure"
| where source_type CONTAINS "vpn" OR message CONTAINS "VPN" OR dest_port IN (443, 1194, 500, 4500)
| stats count, dc(user) as unique_users, min(timestamp) as timestamp by src_ip
| where count > 20
| eval esc_multi_user_vpn_brute_force=(unique_users > 5)
| eval esc_large_scale_vpn_attack=(unique_users > 20)
| risk score=min(100, 65 + if(esc_multi_user_vpn_brute_force, 15, 0) + if(esc_large_scale_vpn_attack, 10, 0)) entity=src_ip factor=concat("VPN brute force", if(esc_multi_user_vpn_brute_force, "; Multi-user VPN brute force", ""), if(esc_large_scale_vpn_attack, "; Large-scale VPN attack", ""))
| table timestamp, src_ip, count, unique_users, risk_score, risk_factors

---
title: browser_exploitation_indicators
description: Detects browser processes spawning suspicious child processes that may indicate drive-by compromise.
author: nano.rs
severity: high
mode: live
detection_mode: scheduled
schedule: "*/2 * * * *"
lookback: 5m
folder: endpoint
mitre_tactics:
  - TA0001
mitre_techniques:
  - T1189
tags:
  - drive_by
  - browser
  - exploit
ai_triage_hints:
  ignore_when:
    - "Browser extension or plugin"
    - "Known browser helper process"
  suspicious_when:
    - "Browser spawns cmd, powershell, or wscript"
    - "Browser creates executable files"
---
source_type=endpoint_edr OR source_type=windows_sysmon
| where event_type="process_create"
| where parent_process_name IN ("chrome.exe", "firefox.exe", "msedge.exe", "iexplore.exe", "brave.exe")
| where process_name IN ("cmd.exe", "powershell.exe", "wscript.exe", "cscript.exe", "rundll32.exe", "regsvr32.exe", "mshta.exe")
| eval esc_browser_spawned_encoded_powershell=(lower(process_name)="powershell.exe" AND lower(command_line) CONTAINS "-enc")
| risk score=min(100, 85 + if(esc_browser_spawned_encoded_powershell, 10, 0)) entity=src_host factor=concat("Browser spawned shell", if(esc_browser_spawned_encoded_powershell, "; Browser spawned encoded PowerShell", ""))
| table timestamp, src_host, user, parent_process_name, process_name, command_line, risk_score, risk_factors

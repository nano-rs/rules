---
title: trusted_relationship_lateral_access
description: Detects access from partner or vendor networks that deviates from normal patterns.
author: nano.rs
severity: medium
mode: live
detection_mode: scheduled
schedule: "*/10 * * * *"
lookback: 30m
folder: network
mitre_tactics:
  - TA0001
mitre_techniques:
  - T1199
tags:
  - supply_chain
  - partner
  - trusted_access
ai_triage_hints:
  ignore_when:
    - "Normal partner access during business hours"
    - "Known vendor maintenance window"
  suspicious_when:
    - "Access to systems outside normal scope"
    - "Off-hours access from partner network"
---
metadata.log_source IN ("vpn_logs", "firewall", "auth_logs", "windows_event") class_uid=3002 activity_id=1 status="Success"
| where user.name CONTAINS "vendor" OR user.name CONTAINS "partner" OR user.name CONTAINS "contractor" OR user.name CONTAINS "ext_"
| risk score=35 entity=user.name factor="Third-party access"
| eval hour = tonumber(strftime(time, "%H"))
| where hour < 7 OR hour > 19
| risk score=65 factor="Off-hours third-party access"
| eval day = tonumber(strftime(time, "%w"))
| where day = 0 OR day = 6
| risk score=75 factor="Weekend third-party access"
| table time, user.name, src_endpoint.ip, dst_endpoint.hostname, hour, risk_score, risk_factors

---
title: connection_to_newly_seen_domain
description: Detects network connections to domains that were first seen in the environment within the last 24 hours AND have low prevalence. New domains with few hosts connecting to them are strong indicators of C2 infrastructure, phishing, or malicious downloads.
author: nano.rs
severity: high
mode: staging
detection_mode: scheduled
schedule: "*/5 * * * *"
lookback: 1h
folder: network
mitre_tactics:
  - TA0011
mitre_techniques:
  - T1071.001
  - T1102
tags:
  - prevalence
  - new_domain
  - command_control
  - network
ai_triage_hints:
  ignore_when:
    - "Domain is from a major CDN or cloud provider"
    - "Domain matches a recently onboarded SaaS application"
    - "Connection is from IT testing new services"
  suspicious_when:
    - "Domain was registered recently (check WHOIS)"
    - "Domain uses dynamic DNS provider"
    - "Connection occurs outside business hours"
    - "Large data transfer to the domain"
    - "Domain name looks like DGA (random characters)"
---
source_type=proxy OR source_type=firewall OR source_type=dns
| where dest_host != "" AND dest_host LIKE "%.%"
| eval esc_possible_dga_domain=match(dest_host, "(?i)(^[a-z0-9]{12,}\.)|(\d{3,})")
| prevalence enrich=true window=30d
| where host_count < 10 AND prevalence_first_seen > now() - INTERVAL 24 HOUR
| eval esc_very_rare_domain=(host_count < 5)
| eval esc_extremely_rare_domain=(host_count < 3)
| risk score=min(100, 70 + if(esc_very_rare_domain, 10, 0) + if(esc_extremely_rare_domain, 10, 0) + if(esc_possible_dga_domain, 25, 0)) entity=src_host factor=concat("Connection to newly seen domain", if(esc_very_rare_domain, "; Very rare domain", ""), if(esc_extremely_rare_domain, "; Extremely rare domain", ""), if(esc_possible_dga_domain, "; Possible DGA domain", ""))
| table timestamp, src_host, src_ip, user, dest_host, dest_ip, dest_port, host_count, prevalence_first_seen, is_rare, url, risk_score, risk_factors, esc_possible_dga_domain

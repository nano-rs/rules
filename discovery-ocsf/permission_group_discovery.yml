---
title: domain_admin_group_enumeration
description: Detects enumeration of privileged Active Directory groups like Domain Admins and Enterprise Admins.
author: nano.rs
severity: medium
mode: live
detection_mode: scheduled
schedule: "*/5 * * * *"
lookback: 15m
folder: identity
mitre_tactics:
  - TA0007
mitre_techniques:
  - T1069.002
tags:
  - group_enumeration
  - active_directory
  - privilege_recon
ai_triage_hints:
  ignore_when:
    - "IT admin checking group membership"
    - "Known audit or compliance tool"
  suspicious_when:
    - "Targeting Domain Admins or Enterprise Admins"
    - "Multiple admin groups enumerated in sequence"
---
class_uid=1007 activity_id=1
| where process.name IN ("net.exe", "net1.exe") AND process.cmd_line CONTAINS "group"
| where process.cmd_line CONTAINS "domain admins" OR process.cmd_line CONTAINS "enterprise admins" OR process.cmd_line CONTAINS "schema admins" OR process.cmd_line CONTAINS "administrators"
| risk score=55 entity=device.hostname factor="Admin group enumeration"
| where process.cmd_line CONTAINS "/domain"
| risk score=70 factor="Domain admin group query"
| table time, device.hostname, actor.user.name, process.cmd_line, risk_score, risk_factors

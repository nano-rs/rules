---
title: bloodhound_sharphound_collection
description: Detects BloodHound/SharpHound Active Directory enumeration tool execution.
author: nano.rs
severity: high
mode: live
detection_mode: scheduled
schedule: "*/3 * * * *"
lookback: 10m
folder: endpoint
mitre_tactics:
  - TA0007
mitre_techniques:
  - T1087.002
  - T1069.002
tags:
  - bloodhound
  - sharphound
  - ad_enumeration
ai_triage_hints:
  ignore_when:
    - "Authorized red team or pentest engagement"
    - "IT security team running authorized assessment"
  suspicious_when:
    - "SharpHound creating JSON output files"
    - "LDAP queries matching BloodHound patterns"
---
class_uid=1007 activity_id=1
| where process.cmd_line CONTAINS "SharpHound" OR process.cmd_line CONTAINS "bloodhound" OR process.cmd_line CONTAINS "Invoke-BloodHound" OR process.name="sharphound.exe"
| risk score=85 entity=device.hostname factor="BloodHound/SharpHound detected"
| where process.cmd_line CONTAINS "-CollectionMethod All"
| risk score=95 factor="Full AD enumeration"
| table time, device.hostname, actor.user.name, process.name, process.cmd_line, risk_score, risk_factors

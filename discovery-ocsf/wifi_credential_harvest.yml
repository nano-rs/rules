---
title: wifi_credential_harvesting
description: Detects extraction of saved WiFi passwords using netsh wlan commands.
author: nano.rs
severity: medium
mode: live
detection_mode: scheduled
schedule: "*/10 * * * *"
lookback: 30m
folder: endpoint
mitre_tactics:
  - TA0007
  - TA0006
mitre_techniques:
  - T1040
  - T1552
tags:
  - wifi
  - credentials
  - windows
ai_triage_hints:
  ignore_when:
    - "IT admin managing WiFi profiles"
  suspicious_when:
    - "Profile key extraction (show profile key=clear)"
    - "All profiles dumped at once"
---
class_uid=1007 activity_id=1
| where process.name="netsh.exe" AND process.cmd_line CONTAINS "wlan" AND process.cmd_line CONTAINS "show" AND process.cmd_line CONTAINS "profile"
| where process.cmd_line CONTAINS "key=clear"
| risk score=65 entity=device.hostname factor="WiFi credential harvesting"
| table time, device.hostname, actor.user.name, process.cmd_line, risk_score, risk_factors

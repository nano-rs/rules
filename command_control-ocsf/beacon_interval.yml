---
title: regular_beacon_interval_detection
description: Detects network connections with regular beacon-like timing patterns characteristic of C2 implants.
author: nano.rs
severity: high
mode: live
detection_mode: scheduled
schedule: "*/10 * * * *"
lookback: 1h
folder: network
mitre_tactics:
  - TA0011
mitre_techniques:
  - T1095
tags:
  - beacon
  - c2
  - network
ai_triage_hints:
  ignore_when:
    - "Known heartbeat from monitoring agent"
    - "NTP or time sync traffic"
  suspicious_when:
    - "Regular intervals to low-prevalence domain"
    - "Small consistent payload sizes"
---
class_uid=4001
| where NOT is_private_ip(dst_endpoint.ip)
| stats count, dc(time) as unique_times, min(time) as time by src_endpoint.hostname, dst_endpoint.ip, dst_endpoint.port
| where count > 20 AND unique_times > 15
| prevalence enrich=true window=30d
| where host_count < 5
| risk score=70 entity=src_endpoint.hostname factor="Regular beacon pattern"
| where host_count < 2
| risk score=85 factor="Unique destination with beaconing"
| table time, src_endpoint.hostname, dst_endpoint.ip, dst_endpoint.port, count, unique_times, host_count, risk_score, risk_factors

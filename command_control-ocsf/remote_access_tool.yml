---
title: unauthorized_remote_access_tool
description: Detects execution of remote access tools not approved by the organization.
author: nano.rs
severity: medium
mode: live
detection_mode: scheduled
schedule: "*/5 * * * *"
lookback: 15m
folder: endpoint
mitre_tactics:
  - TA0011
mitre_techniques:
  - T1219
tags:
  - rat
  - remote_access
  - c2
ai_triage_hints:
  ignore_when:
    - "IT help desk using approved remote tool"
    - "User-installed remote support for vendor assistance"
  suspicious_when:
    - "RAT installed silently without user interaction"
    - "Multiple remote tools on same host"
---
class_uid=1007
| where process.name IN ("AnyDesk.exe", "TeamViewer.exe", "ScreenConnect.exe", "RemoteDesktop.exe", "ammyy.exe", "RustDesk.exe", "meshagent.exe") OR process.cmd_line CONTAINS "connectwise" OR process.cmd_line CONTAINS "splashtop"
| eval esc_rat_from_suspicious_path=(lower(process.file.path) CONTAINS "temp" OR lower(process.file.path) CONTAINS "appdata")
| risk score=min(100, 50 + if(esc_rat_from_suspicious_path, 25, 0)) entity=device.hostname factor=concat("Remote access tool detected", if(esc_rat_from_suspicious_path, "; RAT from suspicious path", ""))
| table time, device.hostname, actor.user.name, process.name, process.file.path, process.cmd_line, risk_score, risk_factors

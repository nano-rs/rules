---
title: connection_to_newly_seen_domain
description: Detects network connections to domains that were first seen in the environment within the last 24 hours AND have low prevalence. New domains with few hosts connecting to them are strong indicators of C2 infrastructure, phishing, or malicious downloads.
author: nano.rs
severity: high
mode: staging
detection_mode: scheduled
schedule: "*/5 * * * *"
lookback: 1h
folder: network
mitre_tactics:
  - TA0011
mitre_techniques:
  - T1071.001
  - T1102
tags:
  - prevalence
  - new_domain
  - command_control
  - network
ai_triage_hints:
  ignore_when:
    - "Domain is from a major CDN or cloud provider"
    - "Domain matches a recently onboarded SaaS application"
    - "Connection is from IT testing new services"
  suspicious_when:
    - "Domain was registered recently (check WHOIS)"
    - "Domain uses dynamic DNS provider"
    - "Connection occurs outside business hours"
    - "Large data transfer to the domain"
    - "Domain name looks like DGA (random characters)"
---
class_uid=4001 OR class_uid=4002 OR class_uid=4003
| where dst_endpoint.hostname != "" AND dst_endpoint.hostname LIKE "%.%"
| stats min(time) as time, count as connections, values(src_endpoint.ip) as src_ips, values(actor.user.name) as users, values(dst_endpoint.ip) as dst_ips, values(dst_endpoint.port) as dst_ports, values(http_request.url.url_string) as urls by src_endpoint.hostname, dst_endpoint.hostname
| eval esc_possible_dga_domain=match(dst_endpoint.hostname, "(?i)(^[a-z0-9]{12,}\.)|(\d{3,})")
| prevalence dst_endpoint.hostname window=30d
| where host_count < 10 AND prevalence_first_seen > now() - INTERVAL 24 HOUR
| eval esc_very_rare_domain=(host_count < 5)
| eval esc_extremely_rare_domain=(host_count < 3)
| risk score=min(100, 70 + if(esc_very_rare_domain, 10, 0) + if(esc_extremely_rare_domain, 10, 0) + if(esc_possible_dga_domain, 25, 0)) entity=src_endpoint.hostname factor=concat("Connection to newly seen domain", if(esc_very_rare_domain, "; Very rare domain", ""), if(esc_extremely_rare_domain, "; Extremely rare domain", ""), if(esc_possible_dga_domain, "; Possible DGA domain", ""))
| table time, src_endpoint.hostname, src_ips, users, dst_endpoint.hostname, dst_ips, dst_ports, connections, host_count, prevalence_first_seen, is_rare, urls, risk_score, risk_factors, esc_possible_dga_domain

---
title: sysmon_configuration_tampering
description: Detects attempts to stop, uninstall, or modify Sysmon configuration.
author: nano.rs
severity: critical
mode: live
detection_mode: scheduled
schedule: "*/1 * * * *"
lookback: 5m
folder: endpoint
mitre_tactics:
  - TA0112
mitre_techniques:
  - T1685
tags:
  - sysmon
  - edr_tampering
  - windows
ai_triage_hints:
  ignore_when:
    - "IT admin performing authorized Sysmon update"
    - "Deploying new Sysmon configuration via GPO"
  suspicious_when:
    - "Sysmon being uninstalled without replacement"
    - "Configuration change removes important event types"
---
class_uid=1007 activity_id=1
| where (process.name="sysmon.exe" OR process.name="sysmon64.exe") AND (process.cmd_line CONTAINS "-u" OR process.cmd_line CONTAINS "/u")
| risk score=90 entity=device.hostname factor="Sysmon uninstall attempt"
| where process.cmd_line CONTAINS "force"
| risk score=95 factor="Forced Sysmon uninstall"
| table time, device.hostname, actor.user.name, process.cmd_line, risk_score, risk_factors

---
title: windows_event_log_cleared
description: Detects clearing of Windows event logs, often done by attackers to cover their tracks.
author: nano.rs
severity: high
mode: live
detection_mode: scheduled
schedule: "*/2 * * * *"
lookback: 5m
folder: endpoint
mitre_tactics:
  - TA0112
mitre_techniques:
  - T1685.005
tags:
  - log_clearing
  - anti_forensics
  - windows
ai_triage_hints:
  ignore_when:
    - "IT admin performing routine log maintenance"
    - "Automated log rotation policy"
  suspicious_when:
    - "Security or System log cleared"
    - "Cleared by non-admin user"
---
metadata.log_source="windows_event" OR metadata.log_source="windows_sysmon"
| where metadata.event_code="1102" OR metadata.event_code="104" OR (process.name="wevtutil.exe" AND process.cmd_line CONTAINS "cl") OR (process.name="powershell.exe" AND process.cmd_line CONTAINS "Clear-EventLog")
| eval esc_security_log_cleared=(lower(process.cmd_line) CONTAINS "security" OR lower(process.cmd_line) CONTAINS "system" OR lower(metadata.log_name)="security" OR lower(metadata.log_name)="system")
| risk score=min(100, 85 + if(esc_security_log_cleared, 10, 0)) entity=device.hostname factor=concat("Event log cleared", if(esc_security_log_cleared, "; Security log cleared", ""))
| table time, device.hostname, actor.user.name, process.name, process.cmd_line, metadata.event_code, metadata.log_name, risk_score, risk_factors

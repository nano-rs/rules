---
title: hidden_file_or_directory_creation
description: Detects creation of hidden files or directories using attrib or file naming conventions.
author: nano.rs
severity: low
mode: live
detection_mode: scheduled
schedule: "*/10 * * * *"
lookback: 30m
folder: endpoint
mitre_tactics:
  - TA0005
mitre_techniques:
  - T1564.001
tags:
  - hidden_files
  - evasion
  - cross_platform
ai_triage_hints:
  ignore_when:
    - "Application creating its own configuration files"
    - "Known backup or sync tool behavior"
  suspicious_when:
    - "Hidden executable file created"
    - "Hidden directory in non-standard location"
---
class_uid=1007 activity_id=1
| where process.name="attrib.exe" AND process.cmd_line CONTAINS "+h"
| eval esc_hidden_executable=(lower(process.cmd_line) CONTAINS ".exe" OR lower(process.cmd_line) CONTAINS ".dll" OR lower(process.cmd_line) CONTAINS ".ps1")
| risk score=min(100, 40 + if(esc_hidden_executable, 30, 0)) entity=device.hostname factor=concat("Hidden file/directory created", if(esc_hidden_executable, "; Hidden executable", ""))
| table time, device.hostname, actor.user.name, process.cmd_line, risk_score, risk_factors

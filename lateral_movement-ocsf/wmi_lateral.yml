---
title: wmi_remote_execution
description: Detects WMI being used for remote process creation across the network.
author: nano.rs
severity: high
mode: live
detection_mode: scheduled
schedule: "*/3 * * * *"
lookback: 10m
folder: endpoint
mitre_tactics:
  - TA0008
mitre_techniques:
  - T1021.006
tags:
  - wmi
  - remote_execution
  - windows
ai_triage_hints:
  ignore_when:
    - "Known management tool using WMI remotely"
    - "SCCM or MDM agent activity"
  suspicious_when:
    - "WMI creating processes on remote hosts"
    - "Target is sensitive server"
---
class_uid=1007 activity_id=1
| where actor.process.name="wmiprvse.exe"
| where process.name IN ("cmd.exe", "powershell.exe", "pwsh.exe", "mshta.exe", "rundll32.exe")
| risk score=70 entity=device.hostname factor="WMI remote execution"
| where process.cmd_line CONTAINS "-enc" OR process.cmd_line CONTAINS "IEX" OR process.cmd_line CONTAINS "downloadstring"
| risk score=90 factor="Suspicious WMI payload"
| table time, device.hostname, actor.user.name, process.name, process.cmd_line, risk_score, risk_factors

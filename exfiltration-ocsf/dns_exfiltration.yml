---
title: dns_data_exfiltration
description: Detects DNS tunneling and exfiltration via long or encoded DNS queries.
author: nano.rs
severity: high
mode: live
detection_mode: scheduled
schedule: "*/5 * * * *"
lookback: 15m
folder: network
mitre_tactics:
  - TA0010
mitre_techniques:
  - T1048.001
tags:
  - dns
  - tunneling
  - exfiltration
ai_triage_hints:
  ignore_when:
    - "DNS query is for known CDN or analytics service"
    - "DKIM or SPF TXT record lookups"
  suspicious_when:
    - "Very long subdomain labels (>30 chars)"
    - "High volume of unique subdomains for one domain"
---
class_uid=4003
| where query.hostname!="" AND length(query.hostname) > 60
| risk score=70 entity=src_endpoint.hostname factor="Long DNS query (possible tunneling)"
| where query.hostname=/^[a-z0-9]{30,}\./i
| risk score=85 factor="High entropy DNS query"
| table time, src_endpoint.hostname, src_endpoint.ip, query.hostname, risk_score, risk_factors

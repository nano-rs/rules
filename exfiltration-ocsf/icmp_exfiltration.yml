---
title: icmp_data_exfiltration
description: Detects large or frequent ICMP traffic that may indicate data exfiltration over ICMP.
author: nano.rs
severity: medium
mode: live
detection_mode: scheduled
schedule: "*/10 * * * *"
lookback: 30m
folder: network
mitre_tactics:
  - TA0010
mitre_techniques:
  - T1048.003
tags:
  - icmp
  - exfiltration
  - covert
ai_triage_hints:
  ignore_when:
    - "Network monitoring tools using ICMP"
    - "Legitimate ping-based monitoring"
  suspicious_when:
    - "Large ICMP payload sizes"
    - "Continuous ICMP to single destination"
---
class_uid=4001
| where connection_info.protocol_num=1
| where dst_endpoint.ip!=/^(10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.)/
| stats count, sum(traffic.bytes_out) as total_bytes, min(time) as time by src_endpoint.ip, dst_endpoint.ip
| where count > 100 OR total_bytes > 1000000
| risk score=60 entity=src_endpoint.ip factor="Excessive ICMP traffic"
| where total_bytes > 10000000
| risk score=80 factor="Large ICMP data transfer"
| table time, src_endpoint.ip, dst_endpoint.ip, count, total_bytes, risk_score, risk_factors

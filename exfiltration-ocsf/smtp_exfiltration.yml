---
title: data_exfiltration_via_email
description: Detects large email attachments or emails to external domains that may indicate data exfiltration.
author: nano.rs
severity: medium
mode: live
detection_mode: scheduled
schedule: "*/10 * * * *"
lookback: 30m
folder: network
mitre_tactics:
  - TA0010
mitre_techniques:
  - T1048.002
tags:
  - email
  - smtp
  - exfiltration
ai_triage_hints:
  ignore_when:
    - "User regularly sends large attachments (marketing, engineering)"
    - "Email to known business partner"
  suspicious_when:
    - "Large attachment to personal email domain"
    - "Encrypted or password-protected attachment"
---
class_uid=4001 OR class_uid=4002
| where email.subject!="" AND traffic.bytes_out > 5000000
| where dst_endpoint.hostname CONTAINS "gmail.com" OR dst_endpoint.hostname CONTAINS "yahoo.com" OR dst_endpoint.hostname CONTAINS "hotmail.com" OR dst_endpoint.hostname CONTAINS "protonmail.com"
| eval bytes_out_mb = round(traffic.bytes_out / 1000000, 2)
| risk score=55 entity=email.from factor="Large email to personal domain"
| where traffic.bytes_out > 20000000
| risk score=75 factor="Very large attachment (>20MB)"
| table time, email.from, src_endpoint.hostname, dst_endpoint.hostname, bytes_out_mb, email.subject, risk_score, risk_factors

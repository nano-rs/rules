---
title: etw_provider_tampering
description: Detects attempts to disable or tamper with Event Tracing for Windows (ETW) providers.
author: nano.rs
severity: high
mode: live
detection_mode: scheduled
schedule: "*/3 * * * *"
lookback: 10m
folder: endpoint
mitre_tactics:
  - TA0112
mitre_techniques:
  - T1685
tags:
  - etw
  - evasion
  - windows
ai_triage_hints:
  ignore_when:
    - "ETW configuration by authorized monitoring tool"
  suspicious_when:
    - "Disabling security-related ETW providers"
    - "Patching ntdll to bypass ETW"
---
source_type=windows_sysmon OR source_type=endpoint_edr
| where event_type="process_create"
| where command_line CONTAINS "logman" AND (command_line CONTAINS "stop" OR command_line CONTAINS "delete") AND command_line CONTAINS "trace"
| eval esc_threat_intelligence_etw_disabled=(lower(command_line) CONTAINS "microsoft-windows-threat-intelligence")
| risk score=min(100, 80 + if(esc_threat_intelligence_etw_disabled, 15, 0)) entity=src_host factor=concat("ETW provider tampering", if(esc_threat_intelligence_etw_disabled, "; Threat Intelligence ETW disabled", ""))
| table timestamp, src_host, user, command_line, risk_score, risk_factors

---
title: host_firewall_rule_modification
description: Detects modifications to the Windows firewall including adding allow rules or disabling profiles.
author: nano.rs
severity: medium
mode: live
detection_mode: scheduled
schedule: "*/5 * * * *"
lookback: 10m
folder: endpoint
mitre_tactics:
  - TA0112
mitre_techniques:
  - T1686.003
tags:
  - firewall
  - defense_evasion
  - windows
ai_triage_hints:
  ignore_when:
    - "Firewall change is from GPO deployment"
    - "Software installer adding legitimate firewall rule"
  suspicious_when:
    - "Firewall profile disabled entirely"
    - "Allow rule for non-standard ports"
---
source_type=windows_sysmon OR source_type=endpoint_edr
| where event_type="process_create"
| where process_name="netsh.exe" AND command_line CONTAINS "firewall"
| where command_line CONTAINS "add" OR command_line CONTAINS "set" OR command_line CONTAINS "disable"
| eval esc_firewall_profile_disabled=(lower(command_line) CONTAINS "disable" AND lower(command_line) CONTAINS "profile")
| eval esc_broad_allow_rule_added=(lower(command_line) CONTAINS "allow" AND lower(command_line) CONTAINS "any")
| risk score=min(100, 50 + if(esc_firewall_profile_disabled, 30, 0) + if(esc_broad_allow_rule_added, 25, 0)) entity=src_host factor=concat("Firewall rule modified", if(esc_firewall_profile_disabled, "; Firewall profile disabled", ""), if(esc_broad_allow_rule_added, "; Broad allow rule added", ""))
| table timestamp, src_host, user, command_line, risk_score, risk_factors

---
title: windows_event_log_cleared
description: Detects clearing of Windows event logs, often done by attackers to cover their tracks.
author: nano.rs
severity: high
mode: live
detection_mode: scheduled
schedule: "*/2 * * * *"
lookback: 5m
folder: endpoint
mitre_tactics:
  - TA0112
mitre_techniques:
  - T1685.005
tags:
  - log_clearing
  - anti_forensics
  - windows
ai_triage_hints:
  ignore_when:
    - "IT admin performing routine log maintenance"
    - "Automated log rotation policy"
  suspicious_when:
    - "Security or System log cleared"
    - "Cleared by non-admin user"
---
source_type=windows_security OR source_type=windows_sysmon
| where event_type="log_clear" OR (process_name="wevtutil.exe" AND command_line CONTAINS "cl") OR (process_name="powershell.exe" AND command_line CONTAINS "Clear-EventLog")
| eval esc_security_log_cleared=(lower(command_line) CONTAINS "security" OR lower(command_line) CONTAINS "system")
| risk score=min(100, 85 + if(esc_security_log_cleared, 10, 0)) entity=src_host factor=concat("Event log cleared", if(esc_security_log_cleared, "; Security log cleared", ""))
| table timestamp, src_host, user, process_name, command_line, risk_score, risk_factors

---
title: drive_by_js_execution_chain
description: Detects a web-delivered ZIP followed by creation of a low-prevalence JavaScript file, WScript execution, outbound network activity, and a WScript-spawned PowerShell stage.
author: nano.rs
severity: critical
mode: staging
detection_mode: scheduled
schedule: "*/2 * * * *"
lookback: 10m
folder: endpoint
mitre_tactics:
  - TA0001
  - TA0002
  - TA0011
mitre_techniques:
  - T1189
  - T1204.002
  - T1059.007
  - T1059.001
  - T1071.001
tags:
  - drive_by
  - javascript
  - wscript
  - powershell
  - prevalence
  - conduit_proxy
  - injector-demo
ai_triage_hints:
  ignore_when:
    - "The archive and script are part of an approved software deployment or security test"
    - "The JavaScript hash and destination are approved by the security team"
  suspicious_when:
    - "The archive came from a newly registered or low-reputation domain"
    - "The JavaScript hash has not appeared on other hosts"
    - "WScript connects to the internet before spawning hidden PowerShell"
    - "Follow-on discovery or Run-key persistence occurs on the same endpoint"
  context: "Correlate the proxy user with the endpoint user, then validate that the endpoint steps share one src_host. Review the ZIP URL, JavaScript hash prevalence, WScript destination, and PowerShell command line."
---
source_type="conduit_proxy" OR source_type="windows_sysmon"
| sequence by user maxspan=5m
    fields(src_host, src_ip, dest_host, dest_ip, dest_port, url, file_path, file_hash, prevalence_file_hash, process_name, parent_process_name, command_line)
    [source_type="conduit_proxy" url CONTAINS "/downloads/" url=/\.zip(\?|$)/i]
    [source_type="windows_sysmon" file_action="create" file_path=/\.js$/i file_hash!="" prevalence_file_hash < 5]
    [source_type="windows_sysmon" event_type="process_create" process_name="wscript.exe" command_line CONTAINS ".js"]
    [source_type="windows_sysmon" event_type="network_connection" process_name="wscript.exe" dest_port=443 NOT is_private_ip(dest_ip)]
    [source_type="windows_sysmon" event_type="process_create" process_name="powershell.exe" parent_process_name="wscript.exe"]
| risk score=95 entity=user factor="Drive-by JavaScript execution chain"
| table timestamp, user, step1_url, step1_dest_host, step2_src_host, step2_file_path, step2_file_hash, step2_prevalence_file_hash, step3_process_name, step3_command_line, step4_dest_host, step4_dest_ip, step4_dest_port, step5_process_name, step5_parent_process_name, step5_command_line, sequence_duration_seconds, risk_score, risk_factors
